default_language_version:
  python: python3

exclude: |
  (?x)^(
    .*thirdparty/.*|
    .*-(dll|dylib|so)_wrap\.[ch]
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        exclude: (SConstruct|SCsub)$ # SCons files use shebangs for syntax highlighting only.

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.7
    hooks:
      - id: clang-format
        files: \.(c|h|cpp|hpp|cc|hh|cxx|hxx|m|mm|inc|java)$
        types_or: [text]
      - id: clang-format
        name: clang-format-glsl
        files: \.glsl$
        types_or: [text]
        args: [-style=file:misc/utility/clang_format_glsl.yml]

  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: clang-tidy
        files: \.(c|h|cpp|hpp|cc|hh|cxx|hxx|m|mm|inc|java|glsl)$
        args: [--fix, --quiet, --use-color]
        types_or: [text]
        additional_dependencies: [clang-tidy==21.1.6]
        require_serial: true
        stages: [manual] # Not automatically triggered, invoked via `pre-commit run --hook-stage manual clang-tidy`

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff-check
        args: [--fix]
        files: (\.py|SConstruct|SCsub)$
        types_or: [text]
      - id: ruff-format
        files: (\.py|SConstruct|SCsub)$
        types_or: [text]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1 # Latest version that supports Python 3.8
    hooks:
      - id: mypy
        files: \.py$
        types_or: [text]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies: [tomli]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.34.1
    hooks:
      - id: check-jsonschema
        files: ^core/extension/foundry_extension_interface\.json$
        args: ["--schemafile", "core/extension/foundry_extension_interface.schema.json"]

  - repo: local
    hooks:
      - id: make-rst
        name: make-rst
        language: python
        entry: python doc/tools/make_rst.py
        args: [doc/classes, modules, platform, --dry-run, --color]
        pass_filenames: false
        files: ^(doc/classes|.*/doc_classes)/.*\.xml$

      - id: doc-status
        name: doc-status
        language: python
        entry: python doc/tools/doc_status.py
        args: [doc/classes, modules/*/doc_classes, platform/*/doc_classes, -c]
        pass_filenames: false
        files: ^(doc/classes|.*/doc_classes)/.*\.xml$

      - id: validate-builders
        name: validate-builders
        language: python
        entry: python tests/python_build/validate_builders.py
        pass_filenames: false
        files: ^(gles3|glsl)_builders\.py$

      - id: validate-sconstruct-warnings
        name: validate-sconstruct-warnings
        language: python
        entry: python tests/python_build/validate_sconstruct_warnings.py
        pass_filenames: false
        files: ^(SConstruct|tests/python_build/validate_sconstruct_warnings\.py)$

      - id: validate-xml
        name: validate-xml
        language: python
        entry: python misc/scripts/validate_xml.py
        files: ^(doc/classes|.*/doc_classes)/.*\.xml$
        additional_dependencies: [xmlschema]

      - id: eslint
        name: eslint
        language: node
        entry: eslint
        files: ^(platform/web/js/|modules/|misc/dist/html/).*\.(js|html)$
        args:
          - --fix
          - --no-warn-ignored
          - --no-config-lookup
          - --config
          - platform/web/eslint.config.cjs
        additional_dependencies:
          - "@eslint/js@^9.3.0"
          - "@html-eslint/eslint-plugin@^0.24.1"
          - "@html-eslint/parser@^0.24.1"
          - "@stylistic/eslint-plugin@^2.1.0"
          - eslint@^9.3.0
          - eslint-plugin-html@^8.1.1
          - globals@^15.3.0
          - espree@^10.0.1

      - id: jsdoc
        name: jsdoc
        language: node
        entry: jsdoc
        files: ^platform/web/js/engine/(engine|config|features)\.js$
        args:
          - --template
          - platform/web/js/jsdoc2rst/
          - platform/web/js/engine/engine.js
          - platform/web/js/engine/config.js
          - platform/web/js/engine/features.js
          - --destination
          - ""
          - -d
          - dry-run
        pass_filenames: false
        additional_dependencies: [jsdoc@^4.0.3]

      - id: svgo
        name: svgo
        language: node
        entry: svgo
        files: \.svg$
        args: [--quiet, --config, misc/utility/svgo.config.mjs]
        additional_dependencies: [svgo@3.3.2]

      - id: copyright-headers
        name: copyright-headers
        language: python
        entry: python misc/scripts/copyright_headers.py
        files: \.(c|h|cpp|hpp|cc|hh|cxx|hxx|m|mm|inc|java)$
        exclude: |
          (?x)^(
            core/math/bvh_.*\.inc|
            platform/(?!android|ios|linuxbsd|macos|web|windows)\w+/.*
          )$

      - id: header-guards
        name: header-guards
        language: python
        entry: python misc/scripts/header_guards.py
        files: \.(h|hpp|hh|hxx)$

      - id: file-format
        name: file-format
        language: python
        entry: python misc/scripts/file_format.py
        types_or: [text]
        exclude: |
          (?x)^(
            .*\.test\.txt|
            .*\.svg|
            .*\.patch|
            .*\.out|
            modules/foundry_script/tests/scripts/parser/features/mixed_indentation_on_blank_lines\.fs|
            modules/foundry_script/tests/scripts/parser/warnings/empty_file_newline_comment\.norun\.fs|
            modules/foundry_script/tests/scripts/parser/warnings/empty_file_newline\.norun\.fs|
            tests/data/.*\.bin
          )$

      - id: dotnet-format
        name: dotnet-format
        language: python
        entry: python misc/scripts/dotnet_format.py
        types_or: [c#]
#
# End of upstream Godot pre-commit hooks.
#
# Keep this separation to let downstream forks add their own hooks to this file,
# without running into merge conflicts when rebasing on latest upstream.
#
# Start of downstream pre-commit hooks.
#
# This is still the "repo: local" scope, so new local hooks can be defined directly at this indentation:
#     - id: new-local-hook
# To add external repo hooks, bring the indentation back to:
# - repo: my-remote-hook

      - id: foundry-headless-docker-contract
        name: Foundry headless Docker contract
        language: python
        entry: python .github/scripts/test_foundry_headless_docker.py
        pass_filenames: false
        files: ^(?:\.gitignore$|docker(?:/|$)|tests/fixtures/headless_container(?:/|$)|\.github/scripts/test_foundry_headless_docker\.py$)

      - id: foundry-release-container-workflow
        name: Foundry release container workflow
        language: python
        entry: python .github/scripts/test_release_container_workflow.py
        pass_filenames: false
        files: ^(?:\.gitignore$|\.github/(?:workflows/release\.yml$|actionlint\.yaml$|scripts/(?:resolve_container_alias\.py$|test_(?:foundry_headless_docker|release_container_workflow)\.py$))|docker(?:/|$)|tests/fixtures/headless_container(?:/|$))

      - id: foundry-android-runtime-identifiers
        name: Foundry Android runtime identifiers
        language: python
        entry: python misc/scripts/test_android_runtime_identifiers.py
        pass_filenames: false
        files: |
          (?x)^(
            \.pre-commit-config\.yaml|
            misc/scripts/test_android_runtime_identifiers\.py|
            platform/android/(?:android_jni_contract\.py|android_native_contract\.py|android_native_staging\.py|SCsub)|
            platform/android/export/export_plugin\.cpp|
            platform/android/java/(?:app/|lib(?:/|$)|build\.gradle|settings\.gradle)|
            platform/android/java_foundry_(?:lib_jni|wrapper)\.cpp|
            tests/python_build/test_android_runtime_surface\.py
          )$

      - id: foundry-java-android-export
        name: Foundry-Java Android export contracts
        language: python
        entry: python -m unittest
        args:
          - tests.python_build.test_android_foundry_java_export
        pass_filenames: false
        files: |
          (?x)^(
            \.pre-commit-config\.yaml|
            \.github/workflows/android_builds\.yml|
            platform/android/ANDROID_RUNTIME\.md|
            platform/android/android_device_acceptance\.py|
            platform/android/android_source_template\.py|
            platform/android/doc_classes/EditorExportPlatformAndroid\.xml|
            platform/android/export/export_plugin\.(?:cpp|h)|
            platform/android/java/app/(?:build|config)\.gradle|
            platform/android/java/app/settings\.gradle|
            tests/fixtures/android_foundry_java/.*|
            tests/python_build/test_android_device_acceptance\.py|
            tests/python_build/test_android_foundry_java_export\.py|
            tests/python_build/test_android_gradle_(?:behavioral|runtime_contract)\.py
          )$

      - id: foundry-android-native-contracts
        name: Foundry Android native contracts
        language: python
        entry: python -m unittest
        args:
          - tests.python_build.test_android_jni_contract
          - tests.python_build.test_android_native_staging
        pass_filenames: false
        files: |
          (?x)^(
            \.pre-commit-config\.yaml|
            platform/android/(?:android_jni_contract|android_native_contract|android_native_staging)\.py|
            platform/android/java/lib/(?:build\.gradle|src/.*)|
            tests/python_build/(?:android_native_test_support|test_android_(?:jni_contract|native_staging|runtime_contract))\.py
          )$

      - id: foundry-android-runtime-workflows
        name: Foundry Android runtime workflows
        language: python
        entry: python .github/scripts/test_android_runtime_workflows.py
        pass_filenames: false
        files: |
          (?x)^(
            \.pre-commit-config\.yaml|
            \.github/actions/foundry-build/action\.yml|
            \.github/scripts/test_android_runtime_workflows\.py|
            \.github/workflows/(android_builds|android_java_check|release)\.yml|
            misc/scripts/test_release_resolver\.py|
            platform/android/(?:android_jni_contract|android_native_contract|android_native_staging|platform_android_builders)\.py|
            platform/android/java/(?:build|lib/build)\.gradle|
            tests/python_build/test_android_runtime_surface\.py
          )$

      - id: foundry-android-device-acceptance
        name: Foundry Android device acceptance
        language: python
        entry: python -m unittest
        args:
          - tests.python_build.test_android_gradle_runtime_contract
          - tests.python_build.test_android_device_acceptance
        pass_filenames: false
        files: |
          (?x)^(
            \.pre-commit-config\.yaml|
            \.github/scripts/test_android_runtime_workflows\.py|
            \.github/workflows/android_builds\.yml|
            misc/scripts/test_android_runtime_identifiers\.py|
            platform/android/ANDROID_RUNTIME\.md|
            platform/android/android_device_acceptance\.py|
            platform/android/java/app/src/androidTestInstrumented/.*/FoundryAppTest\.kt|
            platform/android/java/app/src/instrumented/AndroidManifest\.xml|
            platform/android/java/app/src/instrumented/assets/.*|
            tests/python_build/test_android_device_acceptance\.py|
            tests/python_build/test_android_gradle_runtime_contract\.py
          )$
