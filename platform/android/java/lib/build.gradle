plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

dependencies {
    implementation "androidx.core:core:$versions.coreVersion"
    implementation "androidx.fragment:fragment:$versions.fragmentVersion"
    implementation "androidx.documentfile:documentfile:$versions.documentfileVersion"

    testImplementation "junit:junit:4.13.2"

    androidTestImplementation "androidx.test.ext:junit:$versions.junitVersion"
    androidTestImplementation "androidx.test:runner:$versions.testRunnerVersion"
}

def pathToRootDir = "../../../../"
def foundryLibraryVersion = getFoundryLibraryVersionName()
def foundryEngineRevision = getFoundryEngineRevision()
def supportedAbis = ["arm32", "arm64", "x86_32", "x86_64"]
def selectedAbis = providers.gradleProperty("selectedAbis").map { value ->
    value.split(",").collect { it.trim() }.findAll { !it.isEmpty() }
}.orElse(supportedAbis).get()
def androidAbiBySconsArch = [
    arm32: "armeabi-v7a",
    arm64: "arm64-v8a",
    x86_32: "x86",
    x86_64: "x86_64",
]
def supportedBuildTypes = ["debug", "dev", "release"]
def pythonExecutable = providers.gradleProperty("pythonExecutable").orElse("python3")
def nativeStagingTool = rootProject.file("../android_native_staging.py")
def foundryNativeRoot = providers.gradleProperty("foundryNativeRoot").orNull
def foundryNativeBundle = providers.gradleProperty("foundryNativeBundle").orNull
def foundryRuntimeScratch = providers.gradleProperty("foundryRuntimeScratch").orNull
def usesPrebuiltNativeInput = foundryNativeRoot != null || foundryNativeBundle != null
if (foundryNativeRoot != null && foundryNativeBundle != null) {
    throw new GradleException("Use only one of foundryNativeRoot or foundryNativeBundle.")
}
if (usesPrebuiltNativeInput && foundryRuntimeScratch == null) {
    throw new GradleException("foundryRuntimeScratch is required with a prebuilt native input.")
}
def foundryNativeInputIdentity = foundryNativeRoot != null
    ? "root:${file(foundryNativeRoot).absolutePath}"
    : (foundryNativeBundle != null
        ? "bundle:${file(foundryNativeBundle).absolutePath}"
        : "local:${file("${pathToRootDir}bin/android-native").absolutePath}")
def foundryNativeInputDigest = java.security.MessageDigest.getInstance("SHA-256").digest(
    "${foundryEngineRevision}\u0000${foundryNativeInputIdentity}\u0000${selectedAbis.join(',')}".getBytes("UTF-8")
)
def foundryNativeInputKey = foundryNativeInputDigest.encodeHex().toString().substring(0, 20)
// Each revision/input/selection gets a fresh whole stage; source sets never consume persistent lib/libs.
def androidNativeStage = file(
    "build/android-native-stage/${foundryEngineRevision}/${foundryNativeInputKey}/${selectedAbis.join('-')}"
)

def getSconsTaskName = { String flavor, String buildType, String abi ->
    return "compileFoundryNativeLibs" + flavor.capitalize() + buildType.capitalize() + abi.capitalize()
}

android {
    compileSdkVersion versions.compileSdk
    buildToolsVersion versions.buildTools
    ndkVersion versions.ndkVersion

    defaultConfig {
        minSdkVersion versions.minSdk
        targetSdkVersion versions.targetSdk
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [
            foundryLibraryVersion: foundryLibraryVersion,
            foundryEngineVersion: foundryLibraryVersion,
            foundryEngineRevision: foundryEngineRevision,
            foundryJniContractVersion: "1",
        ]

        buildConfigField 'String', 'FOUNDRY_BINDINGS_VERSION', "\"${foundryLibraryVersion}\""
        buildConfigField 'String', 'FOUNDRY_ENGINE_VERSION', "\"${foundryLibraryVersion}\""
        buildConfigField 'String', 'FOUNDRY_ENGINE_REVISION', "\"${foundryEngineRevision}\""
        buildConfigField 'int', 'FOUNDRY_JNI_CONTRACT_VERSION', '1'
    }

    namespace = 'games.cafecito.foundry'

    compileOptions {
        sourceCompatibility versions.javaVersion
        targetCompatibility versions.javaVersion
    }

    kotlinOptions {
        jvmTarget = versions.javaVersion
    }

    buildFeatures {
        aidl = true
        buildConfig = true
    }

    buildTypes {
        dev {
            initWith debug
            matchingFallbacks = ['debug']
        }
    }

    flavorDimensions = ["products"]
    productFlavors {
        template {}
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lintOptions {
        abortOnError true
        disable 'MissingTranslation', 'UnusedResources'
    }

    packagingOptions {
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/NOTICE'

        if (shouldNotStrip()) {
            jniLibs {
                keepDebugSymbols += '**/*.so'
            }
        }
    }

    sourceSets {
        debug.jniLibs.srcDirs = [new File(androidNativeStage, "debug")]
        dev.jniLibs.srcDirs = [new File(androidNativeStage, "dev")]
        release.jniLibs.srcDirs = [new File(androidNativeStage, "release")]
    }

    libraryVariants.all { variant ->
        def flavorName = variant.getFlavorName()
        if (flavorName != "template") {
            throw new GradleException("Invalid product flavor: $flavorName")
        }

        def buildType = variant.buildType.name
        if (!supportedBuildTypes.contains(buildType)) {
            throw new GradleException("Invalid build type: $buildType")
        }

        boolean devBuild = buildType == "dev"
        boolean productionBuild = buildType == "release"
        String sconsTarget = productionBuild ? "template_release" : "template_debug"

        variant.outputs.all { output ->
            output.outputFileName = "foundry-${buildType}.aar"
        }

        if (!selectedAbis.isEmpty()) {
            List<Object> nativeProducerTasks = []
            File sconsExecutableFile = null
            if (!usesPrebuiltNativeInput) {
                def sconsName = "scons"
                def sconsExts = (org.gradle.internal.os.OperatingSystem.current().isWindows()
                    ? [".bat", ".cmd", ".ps1", ".exe"]
                    : [""])
                for (ext in sconsExts) {
                    String sconsNameExt = sconsName + ext
                    sconsExecutableFile = org.gradle.internal.os.OperatingSystem.current().findInPath(sconsNameExt)
                    if (sconsExecutableFile != null) {
                        break
                    }
                    List<File> allOptions =
                        org.gradle.internal.os.OperatingSystem.current().findAllInPath(sconsNameExt)
                    if (!allOptions.isEmpty()) {
                        sconsExecutableFile = allOptions.get(0)
                        break
                    }
                }
                if (sconsExecutableFile == null) {
                    throw new GradleException("Unable to find executable path for the '$sconsName' command.")
                }
            }

            for (String selectedAbi : selectedAbis) {
                if (!supportedAbis.contains(selectedAbi)) {
                    throw new GradleException("Invalid selected abi: $selectedAbi")
                }
                String androidAbi = androidAbiBySconsArch[selectedAbi]

                if (!usesPrebuiltNativeInput) {
                    def taskName = getSconsTaskName(flavorName, buildType, selectedAbi)
                    def nativeTask = tasks.create(name: taskName, type: Exec) {
                        executable sconsExecutableFile.absolutePath
                        args "--directory=${pathToRootDir}",
                            "platform=android",
                            "production=${productionBuild}",
                            "dev_mode=${devBuild}",
                            "dev_build=${devBuild}",
                            "debug_symbols=${devBuild}",
                            "tests=no",
                            "swappy=yes",
                            "target=${sconsTarget}",
                            "arch=${selectedAbi}",
                            "-j" + Runtime.runtime.availableProcessors()

                        doLast {
                            File nativeCell = file(
                                "${pathToRootDir}bin/android-native/${foundryEngineRevision}/${buildType}/${androidAbi}"
                            )
                            for (String library : ["libfoundry_android.so", "libc++_shared.so"]) {
                                if (!new File(nativeCell, library).isFile()) {
                                    throw new GradleException(
                                        "Missing native library: ${new File(nativeCell, library)}"
                                    )
                                }
                            }
                        }
                    }
                    nativeProducerTasks.add(nativeTask)
                }
            }

            String stageTaskName = "stageFoundryNative${flavorName.capitalize()}${buildType.capitalize()}"
            def stageTask = tasks.register(stageTaskName, Exec) {
                dependsOn nativeProducerTasks
                inputs.file(nativeStagingTool)
                outputs.dir(new File(androidNativeStage, buildType))
                outputs.upToDateWhen { false }
                List<String> command = [
                    pythonExecutable.get(),
                    nativeStagingTool.absolutePath,
                    "--revision", foundryEngineRevision,
                    "--engine-version", foundryLibraryVersion,
                    "--bindings-version", foundryLibraryVersion,
                    "--build-type", buildType,
                    "--selected-abis", selectedAbis.collect { androidAbiBySconsArch[it] }.join(","),
                    "--output", new File(androidNativeStage, buildType).absolutePath,
                ]
                if (foundryNativeRoot != null) {
                    command += ["--native-root", file(foundryNativeRoot).absolutePath]
                } else if (foundryNativeBundle != null) {
                    command += ["--native-bundle", file(foundryNativeBundle).absolutePath]
                } else {
                    command += [
                        "--local-root",
                        file("${pathToRootDir}bin/android-native/${foundryEngineRevision}").absolutePath,
                    ]
                }
                if (foundryRuntimeScratch != null) {
                    command += ["--runtime-scratch", file(foundryRuntimeScratch).absolutePath]
                }
                commandLine command
            }
            if (usesPrebuiltNativeInput && buildType == "dev") {
                stageTask.configure { mustRunAfter "stageFoundryNative${flavorName.capitalize()}Debug" }
            } else if (usesPrebuiltNativeInput && buildType == "release") {
                stageTask.configure { mustRunAfter "stageFoundryNative${flavorName.capitalize()}Dev" }
            }
            tasks["merge${flavorName.capitalize()}${buildType.capitalize()}JniLibFolders"].dependsOn stageTask
        }
    }
}
