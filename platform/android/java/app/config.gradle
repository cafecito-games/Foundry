ext.getOpenXRLoaderVersion = { ->
    String version = project.hasProperty("openxr_loader_version") ? project.property("openxr_loader_version") : ""
    if (version == null || version.isEmpty()) {
        return ""
    }
    if (!(version ==~ /\d+\.\d+\.\d+/)) {
        throw new GradleException("Invalid OpenXR Android loader version: $version")
    }
    return version
}

final String FOUNDRY_JAVA_REGISTRY_MARKER = "registry-index-v2"
final String FOUNDRY_JAVA_LIST_SEPARATOR_REGEX = "\\|"
final String FOUNDRY_JAVA_COORDINATE_REGEX =
    "[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+"

ext.getFoundryJavaRegistryMarker = { ->
    String marker = project.hasProperty("foundry_java_registry_marker") ?
        project.property("foundry_java_registry_marker") : ""
    if (!marker.isEmpty() && marker != FOUNDRY_JAVA_REGISTRY_MARKER) {
        throw new GradleException(
            "Invalid foundry_java_registry_marker '$marker'; expected $FOUNDRY_JAVA_REGISTRY_MARKER"
        )
    }
    return marker
}

ext.getFoundryJavaEnabled = { ->
    return !getFoundryJavaRegistryMarker().isEmpty()
}

ext.parseFoundryJavaList = { String propertyName ->
    String raw = project.hasProperty(propertyName) ? project.property(propertyName) : ""
    if (raw.contains("\r") || raw.contains("\n")) {
        throw new GradleException(
            "$propertyName must not contain carriage returns or newlines"
        )
    }
    if (raw.isEmpty()) {
        return []
    }
    List<String> values = raw.split(FOUNDRY_JAVA_LIST_SEPARATOR_REGEX, -1).collect { it.trim() }
    if (values.any { it.isEmpty() }) {
        throw new GradleException("$propertyName contains a blank entry")
    }
    if (values.toSet().size() != values.size()) {
        throw new GradleException("$propertyName contains a duplicate entry")
    }
    return values.sort()
}

ext.validateFoundryJavaCoordinate = { String propertyName, String coordinate ->
    if (!(coordinate ==~ FOUNDRY_JAVA_COORDINATE_REGEX) ||
            coordinate.contains("+") ||
            coordinate.toLowerCase(Locale.ROOT).contains("latest")) {
        throw new GradleException(
            "$propertyName must use an exact Maven group:artifact:version coordinate; found '$coordinate'"
        )
    }
    return coordinate
}

ext.hasSafeFoundryJavaUriSyntax = { String value, boolean allowSquareBrackets ->
    for (int index = 0; index < value.length(); index++) {
        int character = value.charAt(index) as int
        if (character <= 0x20 || character >= 0x7f ||
                character in [0x22, 0x3c, 0x3e, 0x5c, 0x5e, 0x60, 0x7b, 0x7c, 0x7d] ||
                (!allowSquareBrackets && character in [0x5b, 0x5d])) {
            return false
        }
        if (character == 0x25) {
            if (index + 2 >= value.length()) {
                return false
            }
            for (int hexIndex = index + 1; hexIndex <= index + 2; hexIndex++) {
                int hexCharacter = value.charAt(hexIndex) as int
                if (!((hexCharacter >= 0x30 && hexCharacter <= 0x39) ||
                        (hexCharacter >= 0x41 && hexCharacter <= 0x46) ||
                        (hexCharacter >= 0x61 && hexCharacter <= 0x66))) {
                    return false
                }
            }
            index += 2
        }
    }
    return true
}

ext.getFoundryJavaMavenRepositories = { ->
    String diagnostic =
        "foundry_java_maven_repositories must use HTTPS or a local file URL without credentials, query, or fragment"
    String rawRepositories = project.hasProperty("foundry_java_maven_repositories") ?
        project.property("foundry_java_maven_repositories") : ""
    if (!rawRepositories.isEmpty() &&
            rawRepositories.split(FOUNDRY_JAVA_LIST_SEPARATOR_REGEX, -1).any { it != it.trim() }) {
        throw new GradleException(diagnostic)
    }
    List<String> repositories = parseFoundryJavaList("foundry_java_maven_repositories")
    repositories.each { String repository ->
        boolean valid = false
        String rawPath = ""
        boolean safeSyntax = false
        if (repository.startsWith("file:///")) {
            rawPath = repository.substring(8)
            safeSyntax = !rawPath.startsWith("/") &&
                hasSafeFoundryJavaUriSyntax(rawPath, false)
        } else if (repository.startsWith("https://")) {
            String remainder = repository.substring(8)
            int pathSeparator = remainder.indexOf("/")
            rawPath = pathSeparator == -1 ? "" : remainder.substring(pathSeparator)
            safeSyntax = hasSafeFoundryJavaUriSyntax(repository, true) &&
                hasSafeFoundryJavaUriSyntax(rawPath, false)
        }
        if (safeSyntax) {
            URI uri
            try {
                uri = new URI(repository)
                if (uri.scheme == "https") {
                    valid = !uri.isOpaque() &&
                        uri.host != null &&
                        !uri.host.isEmpty() &&
                        uri.userInfo == null &&
                        (uri.port == -1 || (uri.port >= 1 && uri.port <= 65535)) &&
                        uri.rawQuery == null &&
                        uri.rawFragment == null
                } else if (uri.scheme == "file") {
                    valid = !uri.isOpaque() &&
                        uri.rawAuthority == null &&
                        uri.path != null &&
                        uri.path.startsWith("/") &&
                        uri.rawQuery == null &&
                        uri.rawFragment == null
                }
            } catch (URISyntaxException ignored) {
                // The deterministic diagnostic below intentionally does not echo a URL which may contain secrets.
            }
        }
        if (!valid) {
            throw new GradleException(diagnostic)
        }
    }
    return repositories
}

ext.getFoundryJavaMavenArtifacts = { ->
    return parseFoundryJavaList("foundry_java_maven_artifacts").collect {
        validateFoundryJavaCoordinate("foundry_java_maven_artifacts", it)
    }
}

ext.getFoundryJavaLocalArtifacts = { ->
    return parseFoundryJavaList("foundry_java_local_artifacts").collect { String path ->
        String lowerPath = path.toLowerCase(Locale.ROOT)
        if (!(lowerPath.endsWith(".jar") || lowerPath.endsWith(".aar"))) {
            throw new GradleException(
                "foundry_java_local_artifacts entry must be a regular .jar or .aar file: $path"
            )
        }
        File artifact = file(path)
        if (!artifact.isFile()) {
            throw new GradleException(
                "foundry_java_local_artifacts entry must be a regular .jar or .aar file: $path"
            )
        }
        return artifact
    }
}

ext.getFoundryJavaGradlePlugin = { ->
    String kind = project.hasProperty("foundry_java_gradle_plugin_kind") ?
        project.property("foundry_java_gradle_plugin_kind") : ""
    String plugin = project.hasProperty("foundry_java_gradle_plugin") ?
        project.property("foundry_java_gradle_plugin") : ""
    if (!(kind in ["maven", "local"]) || plugin.isEmpty()) {
        throw new GradleException(
            "foundry_java_gradle_plugin_kind and foundry_java_gradle_plugin must select exactly one Maven or local Gradle plugin"
        )
    }
    if (kind == "maven") {
        validateFoundryJavaCoordinate("foundry_java_gradle_plugin", plugin)
    } else {
        File pluginFile = file(plugin)
        if (!pluginFile.isFile() || !pluginFile.name.toLowerCase(Locale.ROOT).endsWith(".jar")) {
            throw new GradleException(
                "foundry_java_gradle_plugin must be a regular local JAR file: $plugin"
            )
        }
    }
    return [kind: kind, value: plugin]
}

ext.validateFoundryJavaExport = { ->
    if (!getFoundryJavaEnabled()) {
        return
    }
    getFoundryJavaGradlePlugin()
    getFoundryJavaMavenRepositories()
    List<String> mavenArtifacts = getFoundryJavaMavenArtifacts()
    List<File> localArtifacts = getFoundryJavaLocalArtifacts()
    if (mavenArtifacts.isEmpty() && localArtifacts.isEmpty()) {
        throw new GradleException(
            "Foundry-Java export requires at least one Maven or local application artifact"
        )
    }
}
