apply from: "app/config.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url "https://central.sonatype.com/repository/maven-snapshots/" }
    }
}

def runtimeBuildTypes = ["debug", "dev", "release"]
def supportedEditions = ["standard", "mono"]
def foundryEngineSource = rootProject.file("../../..")
def foundryRuntimeAarRoot = layout.buildDirectory.dir("foundryAndroidRuntime/aars").get().asFile
def foundryDefaultRuntimeScratch = layout.buildDirectory.dir("foundryAndroidRuntime/scratch").get().asFile
def binDir = new File(foundryEngineSource, "bin")

// Exposed to :app. The exported source template does not define this value and falls back to app/libs.
ext.foundryRuntimeAarRoot = foundryRuntimeAarRoot

def pythonExecutable = providers.gradleProperty("pythonExecutable").orElse("python3")
def standaloneSource = providers.gradleProperty("foundryAndroidSource")
def allowStandaloneFetch = providers.gradleProperty("foundryAndroidFetch").map { value ->
    if (!(value.toLowerCase() in ["true", "false"])) {
        throw new GradleException("foundryAndroidFetch must be true or false")
    }
    return Boolean.parseBoolean(value)
}.orElse(false)
def nativeRoot = providers.gradleProperty("foundryNativeRoot")
def nativeBundle = providers.gradleProperty("foundryNativeBundle")
def runtimeScratch = providers.gradleProperty("foundryRuntimeScratch")

def runtimeDriver = rootProject.file("../android_runtime_build.py")
def runtimeContract = rootProject.file("../android_runtime_contract.py")
def runtimePin = rootProject.file("../foundry_android_runtime.json")

def prepareFoundryAndroidRuntime = tasks.register("prepareFoundryAndroidRuntime", Exec) {
    group = "foundry android"
    description = "Build and validate the pinned standalone Foundry Android runtime AARs."

    inputs.file(runtimeDriver)
    inputs.file(runtimeContract)
    inputs.file(runtimePin)
    inputs.property("foundryAndroidSource", standaloneSource.orElse(""))
    inputs.property("foundryAndroidFetch", allowStandaloneFetch)
    inputs.property("foundryNativeRoot", nativeRoot.orElse(""))
    inputs.property("foundryNativeBundle", nativeBundle.orElse(""))
    inputs.property("foundryRuntimeScratch", runtimeScratch.orElse(""))
    inputs.files(providers.provider {
        def nativeInputs = []
        if (nativeRoot.isPresent() && !nativeRoot.get().trim().isEmpty()) {
            nativeInputs += rootProject.file(nativeRoot.get())
        }
        if (nativeBundle.isPresent() && !nativeBundle.get().trim().isEmpty()) {
            nativeInputs += rootProject.file(nativeBundle.get())
        }
        return nativeInputs
    })
    outputs.dir(foundryRuntimeAarRoot)
    outputs.upToDateWhen { false }

    doFirst {
        def sourceValue = standaloneSource.isPresent() ? standaloneSource.get().trim() : ""
        def fetchValue = allowStandaloneFetch.get()
        def hasStandaloneSource = !sourceValue.isEmpty()
        if (hasStandaloneSource == fetchValue) {
            throw new GradleException(
                "Android runtime preparation requires exactly one standalone source: " +
                "-PfoundryAndroidSource=<git-repository> or -PfoundryAndroidFetch=true."
            )
        }

        def nativeRootValue = nativeRoot.isPresent() ? nativeRoot.get().trim() : ""
        def nativeBundleValue = nativeBundle.isPresent() ? nativeBundle.get().trim() : ""
        if (nativeRootValue.isEmpty() == nativeBundleValue.isEmpty()) {
            throw new GradleException(
                "Android runtime preparation requires exactly one native root or bundle: " +
                "-PfoundryNativeRoot=<complete-cell-root> or -PfoundryNativeBundle=<bundle.zip>."
            )
        }

        def scratchDirectory = runtimeScratch.isPresent() && !runtimeScratch.get().trim().isEmpty()
            ? rootProject.file(runtimeScratch.get())
            : foundryDefaultRuntimeScratch
        def command = [
            pythonExecutable.get(),
            runtimeDriver.absolutePath,
            'prepare',
            '--pin', runtimePin.absolutePath,
            '--engine-source', foundryEngineSource.absolutePath,
            '--scratch', scratchDirectory.absolutePath,
            '--output-aars', foundryRuntimeAarRoot.absolutePath,
        ]
        if (!sourceValue.isEmpty()) {
            command += ['--source-repository', rootProject.file(sourceValue).absolutePath]
        } else {
            command += ['--allow-fetch']
        }
        if (!nativeRootValue.isEmpty()) {
            command += ['--native-root', rootProject.file(nativeRootValue).absolutePath]
        } else {
            command += ['--native-bundle', rootProject.file(nativeBundleValue).absolutePath]
        }
        commandLine(command)
    }
}

def copyFoundryRuntimeAarsToBin = tasks.register("copyFoundryRuntimeAarsToBin", Copy) {
    dependsOn prepareFoundryAndroidRuntime
    from(new File(foundryRuntimeAarRoot, "debug")) {
        include "foundry-debug.aar"
    }
    from(new File(foundryRuntimeAarRoot, "dev")) {
        include "foundry-dev.aar"
    }
    from(new File(foundryRuntimeAarRoot, "release")) {
        include "foundry-release.aar"
    }
    into(binDir)
}

/**
 * Generate the self-contained custom-build source template. The tracked app directory becomes
 * the ZIP root, so runtime AARs are overlaid under its libs directory.
 */
task zipGradleBuild(type: Zip) {
    dependsOn prepareFoundryAndroidRuntime
    from(fileTree(dir: "app", excludes: ["**/build/**", "**/.gradle/**", "**/*.iml"]))
    from(fileTree(dir: ".", includes: ["gradlew", "gradlew.bat", "gradle/**"]))
    from(foundryRuntimeAarRoot) {
        into "libs"
    }
    include "**/*"
    archiveFileName = "android_source.zip"
    destinationDirectory = binDir
}

/**
 * Generate the template APK copy tasks for one edition.
 */
def generateBuildTasks = { String edition = "standard" ->
    if (!supportedEditions.contains(edition)) {
        throw new GradleException("Invalid build edition: $edition")
    }

    def buildTasks = []
    for (String target : runtimeBuildTypes) {
        String capitalizedTarget = target.capitalize()
        String capitalizedEdition = edition.capitalize()
        String taskName = "copy${capitalizedEdition}${capitalizedTarget}BinaryToBin"
        buildTasks += tasks.register(taskName, Copy) {
            String filenameSuffix = edition == "mono" ? "${edition}${capitalizedTarget}" : target
            dependsOn ":app:assemble${capitalizedEdition}${capitalizedTarget}"
            from("app/build/outputs/apk/${edition}/${target}") {
                include "android_${filenameSuffix}.apk"
            }
            into binDir
        }
    }
    return buildTasks
}

task generateFoundryTemplates {
    dependsOn prepareFoundryAndroidRuntime
    dependsOn copyFoundryRuntimeAarsToBin
    dependsOn generateBuildTasks()
    finalizedBy zipGradleBuild
}

task generateFoundryMonoTemplates {
    dependsOn prepareFoundryAndroidRuntime
    dependsOn copyFoundryRuntimeAarsToBin
    dependsOn generateBuildTasks("mono")
    finalizedBy zipGradleBuild
}

task clean(type: Delete) {
    dependsOn "cleanFoundryTemplates"
}

task cleanFoundryTemplates(type: Delete) {
    delete foundryRuntimeAarRoot.parentFile
    delete "app/build"

    delete new File(binDir, "android_debug.apk")
    delete new File(binDir, "android_dev.apk")
    delete new File(binDir, "android_release.apk")
    delete new File(binDir, "android_monoDebug.apk")
    delete new File(binDir, "android_monoDev.apk")
    delete new File(binDir, "android_monoRelease.apk")
    delete new File(binDir, "android_source.zip")
    delete new File(binDir, "foundry-debug.aar")
    delete new File(binDir, "foundry-dev.aar")
    delete new File(binDir, "foundry-release.aar")

    delete new File(binDir, "android-template-debug-native-symbols.zip")
    delete new File(binDir, "android-template-dev-native-symbols.zip")
    delete new File(binDir, "android-template-release-native-symbols.zip")
}
