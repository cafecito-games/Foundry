apply from: "app/config.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url "https://central.sonatype.com/repository/maven-snapshots/" }
    }
}

def runtimeBuildTypes = ["debug", "dev", "release"]
def supportedEditions = ["standard", "mono"]
def foundryEngineSource = rootProject.file("../../..")
def foundrySourceTemplateRoot = layout.buildDirectory.dir("androidSourceTemplate").get().asFile
def stagedSourceTemplate = new File(foundrySourceTemplateRoot, "android_source.zip")
def binDir = new File(foundryEngineSource, "bin")
def sourceTemplateDestination = new File(binDir, "android_source.zip")
def pythonExecutable = providers.gradleProperty("pythonExecutable").orElse("python3")
def sourceTemplateTool = rootProject.file("../android_source_template.py")

def clearAndroidSourceTemplateOutput = tasks.register("clearAndroidSourceTemplateOutput", Delete) {
    delete foundrySourceTemplateRoot
    delete sourceTemplateDestination
}

/**
 * Copy each internally built host AAR into the exported app source template and engine bin directory.
 */
def generateRuntimeAarTasks = {
    return runtimeBuildTypes.collectMany { String target ->
        String capitalizedTarget = target.capitalize()
        def sourceAar = file("lib/build/outputs/aar/foundry-${target}.aar")

        def copyToApp = tasks.register("copy${capitalizedTarget}AARToAppModule", Copy) {
            dependsOn ":lib:assembleTemplate${capitalizedTarget}"
            inputs.file(sourceAar)
            from("lib/build/outputs/aar/foundry-${target}.aar")
            into("app/libs/${target}")
        }
        def copyToBin = tasks.register("copy${capitalizedTarget}AARToBin", Copy) {
            dependsOn ":lib:assembleTemplate${capitalizedTarget}"
            inputs.file(sourceAar)
            from("lib/build/outputs/aar/foundry-${target}.aar")
            into(binDir)
        }
        return [copyToApp, copyToBin]
    }
}

def runtimeAarTasks = generateRuntimeAarTasks()

/**
 * Generate the self-contained custom-build source template from the app and internal host AARs.
 */
def zipGradleBuild = tasks.register("zipGradleBuild", Zip) {
    dependsOn runtimeAarTasks
    mustRunAfter clearAndroidSourceTemplateOutput
    from(fileTree(dir: "app", excludes: ["**/build/**", "**/.gradle/**", "**/*.iml"]))
    from(fileTree(dir: ".", includes: ["gradlew", "gradlew.bat", "gradle/**"]))
    include "**/*"
    archiveFileName = "android_source.zip"
    destinationDirectory = foundrySourceTemplateRoot
}

/**
 * Generate the template APK copy tasks for one edition.
 */
def generateBuildTasks = { String edition = "standard" ->
    if (!supportedEditions.contains(edition)) {
        throw new GradleException("Invalid build edition: $edition")
    }

    return runtimeBuildTypes.collect { String target ->
        String capitalizedTarget = target.capitalize()
        String capitalizedEdition = edition.capitalize()
        String taskName = "copy${capitalizedEdition}${capitalizedTarget}BinaryToBin"
        String filenameSuffix = edition == "mono" ? "${edition}${capitalizedTarget}" : target
        def sourceApk = file("app/build/outputs/apk/${edition}/${target}/android_${filenameSuffix}.apk")
        return tasks.register(taskName, Copy) {
            dependsOn ":app:assemble${capitalizedEdition}${capitalizedTarget}"
            inputs.file(sourceApk)
            from(sourceApk)
            into binDir
        }
    }
}

def standardBuildTasks = generateBuildTasks()
def monoBuildTasks = generateBuildTasks("mono")

def promoteAndroidSourceTemplate = tasks.register("promoteAndroidSourceTemplate", Exec) {
    group = "foundry android"
    description = "Inspect and atomically promote the staged Android source template."
    dependsOn clearAndroidSourceTemplateOutput
    dependsOn zipGradleBuild
    mustRunAfter standardBuildTasks
    mustRunAfter monoBuildTasks
    inputs.file(sourceTemplateTool)
    inputs.file(stagedSourceTemplate)
    outputs.file(sourceTemplateDestination)
    outputs.upToDateWhen { false }
    commandLine(
        pythonExecutable.get(),
        sourceTemplateTool.absolutePath,
        "promote",
        "--archive", stagedSourceTemplate.absolutePath,
        "--destination", sourceTemplateDestination.absolutePath,
    )
}

def promoteStandardAndroidSourceTemplate = tasks.register("promoteStandardAndroidSourceTemplate") {
    dependsOn standardBuildTasks
    dependsOn promoteAndroidSourceTemplate
}

def promoteMonoAndroidSourceTemplate = tasks.register("promoteMonoAndroidSourceTemplate") {
    dependsOn monoBuildTasks
    dependsOn promoteAndroidSourceTemplate
}

task generateFoundryTemplates {
    dependsOn runtimeAarTasks
    dependsOn promoteStandardAndroidSourceTemplate
}

task generateFoundryMonoTemplates {
    dependsOn runtimeAarTasks
    dependsOn promoteMonoAndroidSourceTemplate
}

task clean(type: Delete) {
    dependsOn "cleanFoundryTemplates"
}

task cleanFoundryTemplates(type: Delete) {
    delete foundrySourceTemplateRoot
    delete "lib/libs"
    delete "lib/build"
    delete "app/libs"
    delete "app/build"

    delete new File(binDir, "android_debug.apk")
    delete new File(binDir, "android_dev.apk")
    delete new File(binDir, "android_release.apk")
    delete new File(binDir, "android_monoDebug.apk")
    delete new File(binDir, "android_monoDev.apk")
    delete new File(binDir, "android_monoRelease.apk")
    delete new File(binDir, "android_source.zip")
    delete new File(binDir, "foundry-debug.aar")
    delete new File(binDir, "foundry-dev.aar")
    delete new File(binDir, "foundry-release.aar")

    delete new File(binDir, "android-template-debug-native-symbols.zip")
    delete new File(binDir, "android-template-dev-native-symbols.zip")
    delete new File(binDir, "android-template-release-native-symbols.zip")
}
