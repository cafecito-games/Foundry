apply plugin: 'maven-publish'
apply plugin: 'signing'

group = ossrhGroupId
version = PUBLISH_VERSION

afterEvaluate {
    publishing {
        publications {
            templateDebug(MavenPublication) {
                from components.templateDebug

                // The coordinates of the library, being set from variables that
                // we'll set up later
                groupId ossrhGroupId
                artifactId DEBUG_PUBLISH_ARTIFACT_ID
                version PUBLISH_VERSION

                // Mostly self-explanatory metadata
                pom {
                    name = DEBUG_PUBLISH_ARTIFACT_ID
                    description = 'Foundry Engine Android Library - (Debug) Template Build'
                    url = 'https://www.cafecito.games/'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://github.com/cafecito-games/Foundry/blob/develop/LICENSE.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'cafecito-games'
                            name = 'CafecitoGames'
                            email = 'csueiras@gmail.com'
                        }
                    }

                    // Version control info - if you're using GitHub, follow the
                    // format as seen here
                    scm {
                        connection = 'scm:git:github.com/cafecito-games/Foundry.git'
                        developerConnection = 'scm:git:ssh://github.com/cafecito-games/Foundry.git'
                        url = 'https://github.com/cafecito-games/Foundry/tree/develop'
                    }
                }
            }
            templateRelease(MavenPublication) {
                from components.templateRelease

                // The coordinates of the library, being set from variables that
                // we'll set up later
                groupId ossrhGroupId
                artifactId PUBLISH_ARTIFACT_ID
                version PUBLISH_VERSION

                // Mostly self-explanatory metadata
                pom {
                    name = PUBLISH_ARTIFACT_ID
                    description = 'Foundry Engine Android Library - Template Build'
                    url = 'https://www.cafecito.games/'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://github.com/cafecito-games/Foundry/blob/develop/LICENSE.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'cafecito-games'
                            name = 'CafecitoGames'
                            email = 'csueiras@gmail.com'
                        }
                    }

                    // Version control info - if you're using GitHub, follow the
                    // format as seen here
                    scm {
                        connection = 'scm:git:github.com/cafecito-games/Foundry.git'
                        developerConnection = 'scm:git:ssh://github.com/cafecito-games/Foundry.git'
                        url = 'https://github.com/cafecito-games/Foundry/tree/develop'
                    }
                }
            }
            toolsRelease(MavenPublication) {
                from components.editorRelease

                // The coordinates of the library, being set from variables that
                // we'll set up later
                groupId ossrhGroupId
                artifactId TOOLS_PUBLISH_ARTIFACT_ID
                version PUBLISH_VERSION

                // Mostly self-explanatory metadata
                pom {
                    name = TOOLS_PUBLISH_ARTIFACT_ID
                    description = 'Foundry Engine Tools Android Library - Editor Build'
                    url = 'https://www.cafecito.games/'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://github.com/cafecito-games/Foundry/blob/develop/LICENSE.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'cafecito-games'
                            name = 'CafecitoGames'
                            email = 'csueiras@gmail.com'
                        }
                    }

                    // Version control info - if you're using GitHub, follow the
                    // format as seen here
                    scm {
                        connection = 'scm:git:github.com/cafecito-games/Foundry.git'
                        developerConnection = 'scm:git:ssh://github.com/cafecito-games/Foundry.git'
                        url = 'https://github.com/cafecito-games/Foundry/tree/develop'
                    }
                }
            }
        }
    }
}

def hasConfiguredSigningValue = { value ->
    value != null && !value.toString().trim().isEmpty()
}

def hasSigningCredentials = { ->
    hasConfiguredSigningValue(rootProject.ext["signing.keyId"]) &&
        hasConfiguredSigningValue(rootProject.ext["signing.key"]) &&
        hasConfiguredSigningValue(rootProject.ext["signing.password"])
}

def isSonatypePublishTask = { task ->
    task.name == "publish" ||
        task.name == "publishToSonatype" ||
        task.name == "publishAllPublicationsToSonatypeRepository" ||
        (task.name.startsWith("publish") && task.name.endsWith("PublicationToSonatypeRepository"))
}

if (hasSigningCredentials()) {
    signing {
        useInMemoryPgpKeys(
            rootProject.ext["signing.keyId"],
            rootProject.ext["signing.key"],
            rootProject.ext["signing.password"],
        )
        sign publishing.publications
    }
} else {
    gradle.taskGraph.whenReady { taskGraph ->
        if (taskGraph.allTasks.any(isSonatypePublishTask)) {
            throw new GradleException("Publishing to Sonatype requires SIGNING_KEY_ID, SIGNING_KEY, and SIGNING_PASSWORD.")
        }
    }
}
