[case]
; Number of measured iterations passed to run_benchmark().
iterations=1000000
; Number of discarded warmup iterations before measurement.
warmup=3
; Reporting threshold: overhead_percent above this is flagged by report.py.
; Cached dependent stores should stay in the same band as the independent predecode path.
overhead_threshold_percent=100
; Optional human note shown in the report.
note="Store into a cached receiver-dependent (int, T) slot on Crate[String] vs an equivalent untyped store."
