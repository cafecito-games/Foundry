[case]
; Number of measured iterations passed to run_benchmark(). Overridable per case.
iterations=1000000
; Number of discarded warmup iterations before measurement.
warmup=3
; Reporting threshold: overhead_percent above this is flagged by report.py.
; The floor case has no baseline pair, so the threshold is unused (-1 = none).
overhead_threshold_percent=-1
; Optional human note shown in the report.
note="Harness overhead floor; no A/B pair."
