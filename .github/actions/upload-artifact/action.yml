name: Upload Foundry artifact
description: Upload the Foundry artifact.

inputs:
  name:
    description: The artifact name.
    default: ${{ github.job }}
  path:
    description: The path to upload.
    required: true
    default: bin/*

outputs:
  artifact-id:
    description: The ID of the uploaded artifact.
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-url:
    description: The URL of the uploaded artifact.
    value: ${{ steps.upload.outputs.artifact-url }}
  artifact-digest:
    description: The SHA-256 digest of the uploaded artifact.
    value: ${{ steps.upload.outputs.artifact-digest }}

runs:
  using: composite
  steps:
    - name: Upload Foundry Artifact
      id: upload
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        # Match this repository's maximum artifact retention.
        retention-days: 1
