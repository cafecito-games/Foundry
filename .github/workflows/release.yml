name: 🚀 Release

on:
  # Deliberately no `push: tags` trigger. The release tag is created by an app
  # installation token, and unlike GITHUB_TOKEN those tokens do trigger
  # workflows -- a tag-push trigger would start a second full build matrix that
  # then races to publish a release for a tag that already has one. Releases are
  # cut with workflow_dispatch.
  workflow_dispatch:
    inputs:
      mode:
        description: Release mode. Draft builds assets only; publish creates the tag and publishes the GitHub release.
        required: true
        default: draft
        type: choice
        options:
          - draft
          - publish
      channel:
        description: Release channel, e.g. alpha, beta, rc, stable.
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - rc
          - stable

# Releases publish artifacts and create a GitHub Release, which needs write access.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolve the version/status strings and whether to publish or leave a draft.
  # - Manual draft -> version from version.py, channel from inputs, prerelease number auto-incremented, left as a draft.
  # - Manual publish -> same as manual draft, but creates the resolved tag and publishes in this run.
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      status: ${{ steps.resolve.outputs.status }}
      channel: ${{ steps.resolve.outputs.channel }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      template_version: ${{ steps.resolve.outputs.template_version }}
      draft: ${{ steps.resolve.outputs.draft }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      create_tag: ${{ steps.resolve.outputs.create_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version and publish mode
        id: resolve
        env:
          # Pass untrusted/event-derived values through the environment instead
          # of interpolating them into the script body, to avoid shell injection.
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          MODE_INPUT: ${{ inputs.mode }}
          CHANNEL_INPUT: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/resolve_release.py

      # The TextMate grammar is generated from checked-in engine sources alone, so it is
      # produced here rather than in a build job: a broken generator fails in seconds
      # instead of after the ~1h build matrix.
      - name: Generate FoundryScript TextMate grammar
        env:
          VERSION: ${{ steps.resolve.outputs.release_version }}
        run: |
          python3 modules/foundry_script/grammar/tmlanguage_builder.py \
            --output "tmlanguage/foundryscript-tmlanguage-${VERSION}.json"

      - name: Upload FoundryScript TextMate grammar
        uses: ./.github/actions/upload-artifact
        with:
          name: release-tmlanguage
          path: tmlanguage/*

      # Mint the tag credential before the ~1h build matrix rather than in
      # `publish`, so a bad secret, an expired key, or an installation that no
      # longer covers this repository is reported in seconds instead of after
      # every template is built. Minting is the check: it exercises the whole
      # chain, which a test for a non-empty secret would not.
      - name: Verify release tag credential
        if: steps.resolve.outputs.create_tag == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  build-linux:
    needs: resolve
    runs-on: ubuntu-22.04
    name: Linux ${{ matrix.target }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: editor
            template_scons_flags: ""
          - target: template_debug
            template_scons_flags: foundry_script_frontend=no
          - target: template_release
            template_scons_flags: foundry_script_frontend=no
    env:
      FOUNDRY_VERSION: ${{ needs.resolve.outputs.version }}
      FOUNDRY_VERSION_STATUS: ${{ needs.resolve.outputs.status }}
      FOUNDRY_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      FOUNDRY_CHANNEL: ${{ needs.resolve.outputs.channel }}
      FOUNDRY_GIT_COMMIT: ${{ github.sha }}
      FOUNDRY_GIT_DIRTY: "false"
      FOUNDRY_BUILD_ID: gh
      FOUNDRY_EXTENSION_INTERFACE_FORMAT: 1
      FOUNDRY_EXTENSION_ABI_REVISION: 7
      SCONS_FLAGS: production=yes module_text_server_fb_enabled=yes
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-bin

      - name: Restore Foundry build cache
        uses: ./.github/actions/foundry-cache-restore
        with:
          cache-name: release-linux-${{ matrix.target }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/foundry-deps

      - name: Compilation
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.template_scons_flags }} arch=x86_64
          platform: linuxbsd
          target: ${{ matrix.target }}

      - name: Save Foundry build cache
        uses: ./.github/actions/foundry-cache-save
        with:
          cache-name: release-linux-${{ matrix.target }}
        continue-on-error: true

      - name: Prepare artifact
        run: |
          strip bin/foundry.*
          chmod +x bin/foundry.*

      - name: Verify version metadata
        if: matrix.target == 'editor'
        run: python3 misc/scripts/verify_foundry_version.py bin/foundry.linuxbsd.editor.x86_64

      - name: Generate API artifact bundle
        if: matrix.target == 'editor'
        env:
          VERSION: ${{ needs.resolve.outputs.release_version }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          python3 misc/scripts/package_foundry_api_artifacts.py \
            --binary bin/foundry.linuxbsd.editor.x86_64 \
            --output-dir api-artifacts \
            --version "$VERSION" \
            --tag "$TAG" \
            --commit "$(git rev-parse HEAD)"

      - name: Upload API artifact
        if: matrix.target == 'editor'
        uses: ./.github/actions/upload-artifact
        with:
          name: release-api
          path: api-artifacts/*

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: release-linux-${{ matrix.target }}

  build-windows:
    needs: resolve
    runs-on: windows-latest
    name: Windows ${{ matrix.target }}
    timeout-minutes: 120
    env:
      FOUNDRY_VERSION: ${{ needs.resolve.outputs.version }}
      FOUNDRY_VERSION_STATUS: ${{ needs.resolve.outputs.status }}
      FOUNDRY_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      FOUNDRY_CHANNEL: ${{ needs.resolve.outputs.channel }}
      FOUNDRY_GIT_COMMIT: ${{ github.sha }}
      FOUNDRY_GIT_DIRTY: "false"
      FOUNDRY_BUILD_ID: gh
      FOUNDRY_EXTENSION_INTERFACE_FORMAT: 1
      FOUNDRY_EXTENSION_ABI_REVISION: 7
      SCONS_FLAGS: >-
        production=yes
        module_text_server_fb_enabled=yes
        debug_symbols=no
        "angle_libs=${{ github.workspace }}/"
        "accesskit_sdk_path=${{ github.workspace }}/accesskit-c-0.21.2/"
      SCONS_CACHE_MSVC_CONFIG: true
      PYTHONIOENCODING: utf8
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: editor
            template_scons_flags: ""
          - target: template_debug
            template_scons_flags: foundry_script_frontend=no
          - target: template_release
            template_scons_flags: foundry_script_frontend=no
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore Foundry build cache
        uses: ./.github/actions/foundry-cache-restore
        with:
          cache-name: release-windows-${{ matrix.target }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/foundry-deps

      - name: Download Direct3D 12 SDK components
        shell: bash
        id: d3d12-sdk
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "D3D12_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Windows: Direct3D 12 SDK installation failed, building without Direct3D 12 support."
            echo "D3D12_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Download pre-built ANGLE static libraries
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-angle-static
          version: tags/chromium/6601.2
          file: godot-angle-static-x86_64-msvc-release.zip
          target: angle/angle.zip

      - name: Extract pre-built ANGLE static libraries
        run: Expand-Archive -Force angle/angle.zip ${{ github.workspace }}/

      - name: Download pre-built AccessKit
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-accesskit-c-static
          version: tags/0.21.2
          file: accesskit-c-0.21.2.zip
          target: accesskit-c-0.21.2/accesskit_c.zip

      - name: Extract pre-built AccessKit
        run: unzip -o accesskit-c-0.21.2/accesskit_c.zip

      - name: Compilation
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.template_scons_flags }} arch=x86_64 d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }}
          platform: windows
          target: ${{ matrix.target }}

      - name: Save Foundry build cache
        uses: ./.github/actions/foundry-cache-save
        with:
          cache-name: release-windows-${{ matrix.target }}
        continue-on-error: true

      - name: Prepare artifact
        run: Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: release-windows-${{ matrix.target }}

  build-macos-editor:
    needs: resolve
    runs-on: macos-latest
    name: macOS editor
    timeout-minutes: 120
    env:
      FOUNDRY_VERSION: ${{ needs.resolve.outputs.version }}
      FOUNDRY_VERSION_STATUS: ${{ needs.resolve.outputs.status }}
      FOUNDRY_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      FOUNDRY_CHANNEL: ${{ needs.resolve.outputs.channel }}
      FOUNDRY_GIT_COMMIT: ${{ github.sha }}
      FOUNDRY_GIT_DIRTY: "false"
      FOUNDRY_BUILD_ID: gh
      FOUNDRY_EXTENSION_INTERFACE_FORMAT: 1
      FOUNDRY_EXTENSION_ABI_REVISION: 7
      SCONS_FLAGS: >-
        production=yes
        module_text_server_fb_enabled=yes
        "accesskit_sdk_path=${{ github.workspace }}/accesskit-c-0.21.2/"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Restore Foundry build cache
        uses: ./.github/actions/foundry-cache-restore
        with:
          cache-name: release-macos-editor
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/foundry-deps

      - name: Download pre-built AccessKit
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-accesskit-c-static
          version: tags/0.21.2
          file: accesskit-c-0.21.2.zip
          target: accesskit-c-0.21.2/accesskit_c.zip

      - name: Extract pre-built AccessKit
        run: unzip -o accesskit-c-0.21.2/accesskit_c.zip

      - name: Setup Vulkan SDK
        id: vulkan-sdk
        run: |
          if sh misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "VULKAN_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS: Vulkan SDK installation failed, building without Vulkan support."
            echo "VULKAN_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      # Import the Developer ID Application certificate into a throwaway
      # keychain scoped to this job, so `codesign` (invoked by generate_bundle
      # via bundle_sign_identity below) can find it. The keychain and its
      # random password never leave the runner.
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$CERT_PATH"

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS=()
          while IFS= read -r keychain; do
            keychain="${keychain//\"/}"
            if [ -n "$keychain" ]; then
              EXISTING_KEYCHAINS+=("$keychain")
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"

      # codesign fails silently if bundle_sign_identity doesn't match anything
      # in the keychain (SCons doesn't check its exit code), which previously
      # let an unsigned .app slip through to notarization undetected. Fail
      # fast here instead, with the list of identities actually available.
      - name: Verify signing identity
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          echo "Identities available in the signing keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -qF -- "$MACOS_CODESIGN_IDENTITY"; then
            echo "::error::MACOS_CODESIGN_IDENTITY does not match any identity imported from MACOS_CERTIFICATE into the signing keychain (see identities listed above). codesign would fail to find it and the .app would be built unsigned."
            exit 1
          fi

      - name: Compilation (x86_64)
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=x86_64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }}
          platform: macos
          target: editor

      # The arm64 build runs generate_bundle, lipo-ing both archs into the
      # universal editor .app and codesigning it with the imported Developer
      # ID identity (hardened runtime + entitlements, per platform_macos_builders.py).
      - name: Compilation (arm64) + bundle
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: >-
            ${{ env.SCONS_FLAGS }} arch=arm64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }}
            generate_bundle=yes "bundle_sign_identity=${{ secrets.MACOS_CODESIGN_IDENTITY }}"
          platform: macos
          target: editor

      # Notarize the signed .app with Apple's notary service and staple the
      # ticket, so Gatekeeper accepts it offline on end-user machines.
      - name: Notarize and staple editor .app
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          APP_DIR="$(find bin -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_DIR" ]; then
            echo "::error::No .app bundle found under bin/ to notarize."
            exit 1
          fi

          API_KEY_PATH="$RUNNER_TEMP/apple_api_key.p8"
          echo -n "$APPLE_API_KEY" | base64 --decode -o "$API_KEY_PATH"

          NOTARIZE_ZIP="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --keepParent "$APP_DIR" "$NOTARIZE_ZIP"

          fetch_notary_log() {
            local submission_id="$1"
            if [ -z "$submission_id" ]; then
              return
            fi
            echo "::group::Notary log for submission $submission_id"
            xcrun notarytool log "$submission_id" \
              --key "$API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" || true
            echo "::endgroup::"
          }

          SUBMIT_JSON="$RUNNER_TEMP/notarytool_submit.json"
          # notarytool exits 0 even when the submission is processed as Invalid,
          # so success must be judged from the reported status, not the exit code.
          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --output-format json | tee "$SUBMIT_JSON"

          SUBMISSION_ID="$(python3 -c "import json; print(json.load(open('$SUBMIT_JSON')).get('id', ''))")"
          STATUS="$(python3 -c "import json; print(json.load(open('$SUBMIT_JSON')).get('status', ''))")"

          if [ "$STATUS" != "Accepted" ]; then
            fetch_notary_log "$SUBMISSION_ID"
            rm -f "$API_KEY_PATH" "$NOTARIZE_ZIP" "$SUBMIT_JSON"
            echo "::error::Notarization status was '$STATUS' (expected Accepted); see the notary log above for the rejection reason."
            exit 1
          fi

          xcrun stapler staple "$APP_DIR"
          rm -f "$API_KEY_PATH" "$NOTARIZE_ZIP" "$SUBMIT_JSON"

      - name: Verify version metadata
        run: |
          APP_DIR="$(find bin -maxdepth 1 -name '*.app' -print -quit)"
          BINARY="$(find "$APP_DIR/Contents/MacOS" -type f -print -quit)"
          python3 misc/scripts/verify_foundry_version.py "$BINARY"

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Save Foundry build cache
        uses: ./.github/actions/foundry-cache-save
        with:
          cache-name: release-macos-editor
        continue-on-error: true

      - name: Prune raw binaries
        run: rm -f bin/foundry.macos.* || true

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: release-macos-editor

  build-macos-templates:
    needs: resolve
    runs-on: macos-latest
    name: macOS templates
    timeout-minutes: 150
    env:
      FOUNDRY_VERSION: ${{ needs.resolve.outputs.version }}
      FOUNDRY_VERSION_STATUS: ${{ needs.resolve.outputs.status }}
      FOUNDRY_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      FOUNDRY_CHANNEL: ${{ needs.resolve.outputs.channel }}
      FOUNDRY_GIT_COMMIT: ${{ github.sha }}
      FOUNDRY_GIT_DIRTY: "false"
      FOUNDRY_BUILD_ID: gh
      FOUNDRY_EXTENSION_INTERFACE_FORMAT: 1
      FOUNDRY_EXTENSION_ABI_REVISION: 7
      SCONS_FLAGS: >-
        production=yes
        module_text_server_fb_enabled=yes
        foundry_script_frontend=no
        "accesskit_sdk_path=${{ github.workspace }}/accesskit-c-0.21.2/"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Restore Foundry build cache
        uses: ./.github/actions/foundry-cache-restore
        with:
          cache-name: release-macos-templates
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/foundry-deps

      - name: Download pre-built AccessKit
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-accesskit-c-static
          version: tags/0.21.2
          file: accesskit-c-0.21.2.zip
          target: accesskit-c-0.21.2/accesskit_c.zip

      - name: Extract pre-built AccessKit
        run: unzip -o accesskit-c-0.21.2/accesskit_c.zip

      - name: Setup Vulkan SDK
        id: vulkan-sdk
        run: |
          if sh misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "VULKAN_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS: Vulkan SDK installation failed, building without Vulkan support."
            echo "VULKAN_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      # A single macos_template.app must hold both debug and release universal
      # binaries, so build all four (debug/release x x86_64/arm64) into bin/
      # before generate_bundle assembles the zip on the final build.
      - name: Compilation (template_release x86_64)
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=x86_64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }}
          platform: macos
          target: template_release

      - name: Compilation (template_release arm64)
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }}
          platform: macos
          target: template_release

      - name: Compilation (template_debug x86_64)
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=x86_64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }}
          platform: macos
          target: template_debug

      - name: Compilation (template_debug arm64) + bundle
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }} generate_bundle=yes
          platform: macos
          target: template_debug

      - name: Save Foundry build cache
        uses: ./.github/actions/foundry-cache-save
        with:
          cache-name: release-macos-templates
        continue-on-error: true

      - name: Prune raw binaries
        run: rm -f bin/foundry.macos.* || true

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: release-macos-templates

  build-web:
    needs: resolve
    runs-on: ubuntu-24.04
    name: Web ${{ matrix.name }}
    timeout-minutes: 90
    env:
      FOUNDRY_VERSION: ${{ needs.resolve.outputs.version }}
      FOUNDRY_VERSION_STATUS: ${{ needs.resolve.outputs.status }}
      FOUNDRY_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      FOUNDRY_CHANNEL: ${{ needs.resolve.outputs.channel }}
      FOUNDRY_GIT_COMMIT: ${{ github.sha }}
      FOUNDRY_GIT_DIRTY: "false"
      FOUNDRY_BUILD_ID: gh
      FOUNDRY_EXTENSION_INTERFACE_FORMAT: 1
      FOUNDRY_EXTENSION_ABI_REVISION: 7
      SCONS_FLAGS: production=yes debug_symbols=no use_closure_compiler=yes foundry_script_frontend=no
      EM_VERSION: 4.0.11
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: threads (template_release)
            cache-name: release-web-threads-release
            target: template_release
            scons-flags: threads=yes
          - name: threads (template_debug)
            cache-name: release-web-threads-debug
            target: template_debug
            scons-flags: threads=yes
          - name: nothreads (template_release)
            cache-name: release-web-nothreads-release
            target: template_release
            scons-flags: threads=no
          - name: nothreads (template_debug)
            cache-name: release-web-nothreads-debug
            target: template_debug
            scons-flags: threads=no
          - name: dlink threads (template_release)
            cache-name: release-web-dlink-threads-release
            target: template_release
            scons-flags: threads=yes dlink_enabled=yes
          - name: dlink threads (template_debug)
            cache-name: release-web-dlink-threads-debug
            target: template_debug
            scons-flags: threads=yes dlink_enabled=yes
          - name: dlink nothreads (template_release)
            cache-name: release-web-dlink-nothreads-release
            target: template_release
            scons-flags: threads=no dlink_enabled=yes
          - name: dlink nothreads (template_debug)
            cache-name: release-web-dlink-nothreads-debug
            target: template_debug
            scons-flags: threads=no dlink_enabled=yes
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EM_VERSION }}
          no-cache: true

      - name: Restore Foundry build cache
        uses: ./.github/actions/foundry-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/foundry-deps

      - name: Compilation
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }}
          platform: web
          target: ${{ matrix.target }}

      - name: Save Foundry build cache
        uses: ./.github/actions/foundry-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}

  build-android-native:
    needs: resolve
    runs-on: ubuntu-24.04
    name: Android native ${{ matrix.build_type }} / ${{ matrix.abi }}
    timeout-minutes: 120
    env:
      FOUNDRY_VERSION: ${{ needs.resolve.outputs.version }}
      FOUNDRY_VERSION_STATUS: ${{ needs.resolve.outputs.status }}
      FOUNDRY_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      FOUNDRY_CHANNEL: ${{ needs.resolve.outputs.channel }}
      FOUNDRY_GIT_COMMIT: ${{ github.sha }}
      FOUNDRY_GIT_DIRTY: "false"
      FOUNDRY_BUILD_ID: gh
      FOUNDRY_EXTENSION_INTERFACE_FORMAT: 1
      FOUNDRY_EXTENSION_ABI_REVISION: 7
      SCONS_FLAGS: >-
        module_text_server_fb_enabled=yes
        tests=no
        swappy=yes
        foundry_script_frontend=no
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: debug
            abi: armeabi-v7a
            arch: arm32
            target: template_debug
            production: "no"
            dev_mode: "no"
            dev_build: "no"
            debug_symbols: "no"
            artifact_name: release-android-native-debug-armeabi-v7a
          - build_type: debug
            abi: arm64-v8a
            arch: arm64
            target: template_debug
            production: "no"
            dev_mode: "no"
            dev_build: "no"
            debug_symbols: "no"
            artifact_name: release-android-native-debug-arm64-v8a
          - build_type: debug
            abi: x86
            arch: x86_32
            target: template_debug
            production: "no"
            dev_mode: "no"
            dev_build: "no"
            debug_symbols: "no"
            artifact_name: release-android-native-debug-x86
          - build_type: debug
            abi: x86_64
            arch: x86_64
            target: template_debug
            production: "no"
            dev_mode: "no"
            dev_build: "no"
            debug_symbols: "no"
            artifact_name: release-android-native-debug-x86_64
          - build_type: dev
            abi: armeabi-v7a
            arch: arm32
            target: template_debug
            production: "no"
            dev_mode: "yes"
            dev_build: "yes"
            debug_symbols: "yes"
            artifact_name: release-android-native-dev-armeabi-v7a
          - build_type: dev
            abi: arm64-v8a
            arch: arm64
            target: template_debug
            production: "no"
            dev_mode: "yes"
            dev_build: "yes"
            debug_symbols: "yes"
            artifact_name: release-android-native-dev-arm64-v8a
          - build_type: dev
            abi: x86
            arch: x86_32
            target: template_debug
            production: "no"
            dev_mode: "yes"
            dev_build: "yes"
            debug_symbols: "yes"
            artifact_name: release-android-native-dev-x86
          - build_type: dev
            abi: x86_64
            arch: x86_64
            target: template_debug
            production: "no"
            dev_mode: "yes"
            dev_build: "yes"
            debug_symbols: "yes"
            artifact_name: release-android-native-dev-x86_64
          - build_type: release
            abi: armeabi-v7a
            arch: arm32
            target: template_release
            production: "yes"
            dev_mode: "no"
            dev_build: "no"
            debug_symbols: "no"
            artifact_name: release-android-native-release-armeabi-v7a
          - build_type: release
            abi: arm64-v8a
            arch: arm64
            target: template_release
            production: "yes"
            dev_mode: "no"
            dev_build: "no"
            debug_symbols: "no"
            artifact_name: release-android-native-release-arm64-v8a
          - build_type: release
            abi: x86
            arch: x86_32
            target: template_release
            production: "yes"
            dev_mode: "no"
            dev_build: "no"
            debug_symbols: "no"
            artifact_name: release-android-native-release-x86
          - build_type: release
            abi: x86_64
            arch: x86_64
            target: template_release
            production: "yes"
            dev_mode: "no"
            dev_build: "no"
            debug_symbols: "no"
            artifact_name: release-android-native-release-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Resolve exact engine revision
        id: engine
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore Foundry build cache
        uses: ./.github/actions/foundry-cache-restore
        with:
          cache-name: ${{ matrix.artifact_name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/foundry-deps

      - name: Download Swappy
        run: python3 misc/scripts/install_swappy_android.py

      - name: Compile exact native cell
        uses: ./.github/actions/foundry-build
        with:
          platform: android
          target: ${{ matrix.target }}
          preserve-source-tree: true
          scons-flags: >-
            ${{ env.SCONS_FLAGS }}
            arch=${{ matrix.arch }}
            production=${{ matrix.production }}
            dev_mode=${{ matrix.dev_mode }}
            dev_build=${{ matrix.dev_build }}
            debug_symbols=${{ matrix.debug_symbols }}

      - name: Save Foundry build cache
        uses: ./.github/actions/foundry-cache-save
        with:
          cache-name: ${{ matrix.artifact_name }}
        continue-on-error: true

      - name: Stage native cell with provenance
        env:
          ENGINE_REVISION: ${{ steps.engine.outputs.revision }}
        run: |
          set -euo pipefail
          CELL="bin/android-native/${ENGINE_REVISION}/${{ matrix.build_type }}/${{ matrix.abi }}"
          DEST="${RUNNER_TEMP}/android-native-artifact/${{ matrix.build_type }}/${{ matrix.abi }}"
          test -f "${CELL}/libc++_shared.so"
          test -f "${CELL}/libfoundry_android.so"
          test -f "${CELL}/provenance.json"
          mkdir -p "${DEST}"
          cp "${CELL}/libc++_shared.so" "${DEST}/"
          cp "${CELL}/libfoundry_android.so" "${DEST}/"
          cp "${CELL}/provenance.json" "${DEST}/"

      - name: Upload native cell
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/android-native-artifact

  assemble-android:
    needs:
      - resolve
      - build-android-native
    runs-on: ubuntu-24.04
    name: Assemble Android release templates
    timeout-minutes: 60
    steps:
      - name: Checkout Foundry
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Download every native cell
        uses: actions/download-artifact@v8
        with:
          pattern: 'release-android-native-*'
          path: .test_scratch/android-native
          merge-multiple: true

      - name: Assemble and verify in-tree host
        run: |
          set -euo pipefail
          test "$(find .test_scratch/android-native -name provenance.json -type f | wc -l | tr -d ' ')" = "12"
          cd platform/android/java
          ./gradlew --no-daemon generateFoundryTemplates \
            -PfoundryNativeRoot="${GITHUB_WORKSPACE}/.test_scratch/android-native"
          cd ../../..
          test -f bin/android_debug.apk
          test -f bin/android_dev.apk
          test -f bin/android_release.apk
          test -f bin/android_source.zip
          test -f bin/foundry-debug.aar
          test -f bin/foundry-dev.aar
          test -f bin/foundry-release.aar

      - name: Upload debug Android template
        uses: ./.github/actions/upload-artifact
        with:
          name: release-android-template-debug
          path: bin/android_debug.apk

      - name: Upload release Android template and source
        uses: ./.github/actions/upload-artifact
        with:
          name: release-android-template-release
          path: |
            bin/android_release.apk
            bin/android_source.zip

  build-ios:
    needs: resolve
    runs-on: macos-latest
    name: iOS ${{ matrix.name }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release-ios-device
            cache-name: release-ios-device
            target: template_release
            scons-flags: arch=arm64
            extra-scons-flags: ""

          - name: release-ios-simulator
            cache-name: release-ios-simulator
            target: template_release
            scons-flags: arch=arm64 ios_simulator=yes
            extra-scons-flags: arch=x86_64 ios_simulator=yes

          - name: debug-ios-device
            cache-name: debug-ios-device
            target: template_debug
            scons-flags: arch=arm64
            extra-scons-flags: ""

          - name: debug-ios-simulator
            cache-name: debug-ios-simulator
            target: template_debug
            scons-flags: arch=arm64 ios_simulator=yes
            extra-scons-flags: arch=x86_64 ios_simulator=yes
    env:
      FOUNDRY_VERSION: ${{ needs.resolve.outputs.version }}
      FOUNDRY_VERSION_STATUS: ${{ needs.resolve.outputs.status }}
      FOUNDRY_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      FOUNDRY_CHANNEL: ${{ needs.resolve.outputs.channel }}
      FOUNDRY_GIT_COMMIT: ${{ github.sha }}
      FOUNDRY_GIT_DIRTY: "false"
      FOUNDRY_BUILD_ID: gh
      FOUNDRY_EXTENSION_INTERFACE_FORMAT: 1
      FOUNDRY_EXTENSION_ABI_REVISION: 7
      SCONS_FLAGS: production=yes module_text_server_fb_enabled=yes tests=no debug_symbols=no foundry_script_frontend=no
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Restore Foundry build cache
        uses: ./.github/actions/foundry-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/foundry-deps

      - name: Compilation (primary architecture)
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }}
          platform: ios
          target: ${{ matrix.target }}

      - name: Compilation (simulator x86_64)
        if: matrix.extra-scons-flags != ''
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.extra-scons-flags }}
          platform: ios
          target: ${{ matrix.target }}

      - name: Save Foundry build cache
        uses: ./.github/actions/foundry-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}

  assemble-ios:
    needs: build-ios
    runs-on: macos-latest
    name: Assemble iOS templates
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Download iOS template libraries
        uses: actions/download-artifact@v8
        with:
          pattern: '*-ios-*'
          path: artifacts

      - name: Assemble iOS template
        run: |
          set -euo pipefail
          mkdir -p bin
          for artifact in artifacts/*; do
            cp "$artifact"/* bin/
          done
          python3 misc/scripts/package_ios_templates.py \
            --bin-dir bin \
            --template-dir misc/dist/apple_embedded_xcode \
            --output bin/ios_xcode.zip

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: release-ios
          path: bin/ios_xcode.zip

  # Download every build artifact, rename binaries to their canonical export
  # template filenames, assemble the .tpz export-templates package, and zip the
  # per-platform editors. All release assets are emitted under dist/.
  package:
    needs:
      - resolve
      - build-linux
      - build-windows
      - build-macos-editor
      - build-macos-templates
      - build-web
      - assemble-android
      - assemble-ios
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble release assets
        env:
          VERSION: ${{ needs.resolve.outputs.release_version }}
          TEMPLATE_VERSION: ${{ needs.resolve.outputs.template_version }}
        run: |
          set -euo pipefail
          mkdir -p dist templates

          # API artifacts for language bindings and other external generators.
          cp artifacts/release-api/*.zip dist/

          # The FoundryScript TextMate grammar editor extensions consume.
          cp artifacts/release-tmlanguage/foundryscript-tmlanguage-*.json dist/

          # --- Export templates package (.tpz) ------------------------------
          # The editor expects a single top-level "templates/" directory holding
          # canonically-named binaries plus version.txt.
          echo "$TEMPLATE_VERSION" > templates/version.txt

          # Linux desktop templates.
          cp artifacts/release-linux-template_release/foundry.linuxbsd.template_release.x86_64 templates/linux_release.x86_64
          cp artifacts/release-linux-template_debug/foundry.linuxbsd.template_debug.x86_64 templates/linux_debug.x86_64

          # Windows desktop templates: the GUI executable is the main template,
          # and the console wrapper ships alongside it as *.console.exe (the
          # exporter locates the wrapper by that exact sibling name).
          cp artifacts/release-windows-template_release/foundry.windows.template_release.x86_64.exe templates/windows_release_x86_64.exe
          cp artifacts/release-windows-template_release/foundry.windows.template_release.x86_64.console.exe templates/windows_release_x86_64.console.exe
          cp artifacts/release-windows-template_debug/foundry.windows.template_debug.x86_64.exe templates/windows_debug_x86_64.exe
          cp artifacts/release-windows-template_debug/foundry.windows.template_debug.x86_64.console.exe templates/windows_debug_x86_64.console.exe

          # D3D12 Agility SDK runtime DLLs ship next to the Windows templates,
          # arch-suffixed; the exporter copies them beside the exported game.
          # Only present when the D3D12 SDK was available at build time.
          for dll in D3D12Core d3d12SDKLayers; do
            if [ -f "artifacts/release-windows-template_release/${dll}.dll" ]; then
              cp "artifacts/release-windows-template_release/${dll}.dll" "templates/${dll}.x86_64.dll"
            fi
          done

          # macOS template (single macos_template.app zip with debug + release universals).
          cp artifacts/release-macos-templates/*.zip templates/macos.zip

          # Web templates: threads/nothreads x debug/release, with and without
          # FoundryExtension (dlink) support. Each web build uploads exactly one
          # zip whose suffix depends on PROGSUFFIX, so glob it.
          cp artifacts/release-web-threads-release/*.zip templates/web_release.zip
          cp artifacts/release-web-threads-debug/*.zip templates/web_debug.zip
          cp artifacts/release-web-nothreads-release/*.zip templates/web_nothreads_release.zip
          cp artifacts/release-web-nothreads-debug/*.zip templates/web_nothreads_debug.zip
          cp artifacts/release-web-dlink-threads-release/*.zip templates/web_dlink_release.zip
          cp artifacts/release-web-dlink-threads-debug/*.zip templates/web_dlink_debug.zip
          cp artifacts/release-web-dlink-nothreads-release/*.zip templates/web_dlink_nothreads_release.zip
          cp artifacts/release-web-dlink-nothreads-debug/*.zip templates/web_dlink_nothreads_debug.zip

          # Android templates and source.
          cp artifacts/release-android-template-release/android_release.apk templates/android_release.apk
          cp artifacts/release-android-template-debug/android_debug.apk templates/android_debug.apk
          if [ -f artifacts/release-android-template-release/android_source.zip ]; then
            cp artifacts/release-android-template-release/android_source.zip templates/android_source.zip
          fi

          # iOS template (device + simulator, debug + release).
          cp artifacts/release-ios/*.zip templates/ios.zip

          # upload-artifact/download-artifact does not preserve POSIX executable
          # bits, so restore them on loose Unix binaries before zipping (binaries
          # already inside .zip/.apk artifacts keep their stored permissions).
          chmod +x templates/linux_release.x86_64 templates/linux_debug.x86_64
          chmod +x artifacts/release-linux-editor/foundry.linuxbsd.editor.x86_64
          chmod +x artifacts/release-macos-editor/*.app/Contents/MacOS/*

          ( cd templates && zip -r -q "../dist/Foundry_v${VERSION}_export_templates.tpz" . )

          # --- Editor archives ----------------------------------------------
          ( cd artifacts/release-linux-editor && zip -q "$GITHUB_WORKSPACE/dist/Foundry_v${VERSION}_linux.x86_64.zip" foundry.linuxbsd.editor.x86_64 )
          # The Windows editor needs its D3D12 sidecar DLLs (and console wrapper)
          # alongside the executable; include whichever were produced.
          ( cd artifacts/release-windows-editor
            win_zip="$GITHUB_WORKSPACE/dist/Foundry_v${VERSION}_windows.x86_64.zip"
            zip -q "$win_zip" foundry.windows.editor.x86_64.exe
            for extra in foundry.windows.editor.x86_64.console.exe D3D12Core.dll d3d12SDKLayers.dll; do
              if [ -f "$extra" ]; then zip -q "$win_zip" "$extra"; fi
            done )
          # macOS editor ships as the universal .app bundle produced by generate_bundle.
          ( cd artifacts/release-macos-editor && zip -r -q "$GITHUB_WORKSPACE/dist/Foundry_v${VERSION}_macos.universal.zip" ./*.app )

          echo "Release assets:"
          ls -lh dist/

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*

  publish:
    needs:
      - resolve
      - package
    runs-on: ubuntu-24.04
    outputs:
      github_release_published: ${{ steps.github-release.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Not github.token: GITHUB_TOKEN can never be granted the `workflows`
      # permission, and any ref update -- `git push` or the Git Data API alike --
      # is refused with 403 when the target commit touches .github/workflows/.
      # This app installation holds contents:write plus workflows:write, so
      # release commits that carry CI changes can still be tagged.
      - name: Mint release tag token
        id: release-token
        if: needs.resolve.outputs.create_tag == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Create release tag
        if: needs.resolve.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          TAG_NAME: ${{ needs.resolve.outputs.tag }}
          RELEASE_NAME: ${{ needs.resolve.outputs.release_name }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Tag $TAG_NAME already exists."
            exit 1
          fi

          # The annotated tag is created as an object first, then pointed at by a
          # ref, because `gh api` has no single call for an annotated tag.
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG_NAME" \
            -f message="$RELEASE_NAME" \
            -f object="$GITHUB_SHA" \
            -f type=commit \
            --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG_NAME" \
            -f sha="$TAG_SHA"

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist

      - name: Publish GitHub Release
        id: github-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.release_name }}
          draft: ${{ needs.resolve.outputs.draft }}
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*

      - name: Update Homebrew tap
        if: needs.resolve.outputs.draft == 'false'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
          RELEASE_STATUS: ${{ needs.resolve.outputs.status }}
        run: |
          set -euo pipefail

          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not configured."
            exit 1
          fi

          macos_asset="dist/Foundry_v${RELEASE_VERSION}_macos.universal.zip"
          linux_asset="dist/Foundry_v${RELEASE_VERSION}_linux.x86_64.zip"
          if [ ! -f "$macos_asset" ]; then
            echo "::error::Missing macOS release asset: $macos_asset"
            exit 1
          fi
          if [ ! -f "$linux_asset" ]; then
            echo "::error::Missing Linux release asset: $linux_asset"
            exit 1
          fi

          tap_dir="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/cafecito-games/homebrew-tap.git" "$tap_dir"

          cask_path="$(python3 .github/scripts/generate_homebrew_cask.py \
            --status "$RELEASE_STATUS" \
            --version "$RELEASE_VERSION" \
            --macos-asset "$macos_asset" \
            --linux-asset "$linux_asset" \
            --output-dir "$tap_dir/Casks")"
          cask_token="$(basename "$cask_path" .rb)"

          ruby -c "$cask_path"
          if command -v brew >/dev/null 2>&1; then
            cleanup_homebrew_tap() {
              brew untap cafecito-games/tap >/dev/null 2>&1 || true
            }
            trap cleanup_homebrew_tap EXIT
            brew tap cafecito-games/tap "$tap_dir"
            brew_tap_dir="$(brew --repository cafecito-games/tap)"
            mkdir -p "$brew_tap_dir/Casks"
            cp "$cask_path" "$brew_tap_dir/Casks/${cask_token}.rb"
            brew audit --cask --tap cafecito-games/tap "$cask_token"
            cleanup_homebrew_tap
            trap - EXIT
          fi

          cd "$tap_dir"
          if [ -z "$(git status --porcelain -- "$cask_path")" ]; then
            echo "Homebrew cask $cask_token is already up to date for v${RELEASE_VERSION}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$cask_path"
          git commit -m "Brew cask update for ${cask_token} version v${RELEASE_VERSION}"
          git push origin HEAD:main

  publish-container:
    needs:
      - resolve
      - build-linux
      - publish
    if: >-
      ${{
        !cancelled()
        && needs.resolve.result == 'success'
        && needs.build-linux.result == 'success'
        && needs.resolve.outputs.draft == 'false'
        && needs.publish.outputs.github_release_published == 'true'
      }}
    runs-on: ubuntu-24.04
    concurrency:
      group: release-container-${{ needs.resolve.outputs.channel }}
      cancel-in-progress: false
      queue: max
    # Registry-attached BuildKit attestations use package auth, not OIDC permissions for the separate actions/attest.
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/cafecito-games/foundry
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Linux editor artifact
        uses: actions/download-artifact@v8
        with:
          name: release-linux-editor
          path: docker

      - name: Restore Linux executable mode
        run: chmod 0755 docker/foundry.linuxbsd.editor.x86_64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve moving channel tag
        id: channel-tag
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          if [ "$CHANNEL" = "stable" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest-$CHANNEL" >> "$GITHUB_OUTPUT"
          fi

      - name: Check moving alias freshness
        id: release-freshness
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          # The listing needs the workflow token, so it stays here; the decision logic is testable.
          releases_json="$RUNNER_TEMP/published-releases.json"
          if ! gh api \
            --paginate \
            --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$releases_json"; then
            rm -f "$releases_json"
          fi
          RELEASES_JSON="$releases_json" .github/scripts/resolve_channel_tag_freshness.sh

      - name: Resolve image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.tag }}
            type=raw,value=${{ steps.channel-tag.outputs.tag }},enable=${{ steps.release-freshness.outputs.publish_channel_tag == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ needs.resolve.outputs.release_version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build local smoke image
        uses: docker/build-push-action@v6
        # The local and registry exports share this builder and identical context/Dockerfile/platform/args/labels.
        # load: true makes the image runnable for pre-auth smoke; the local exporter cannot retain SBOM/provenance.
        with:
          context: docker
          file: docker/foundry-headless.Dockerfile
          platforms: linux/amd64
          load: true
          tags: foundry-headless-smoke:${{ github.sha }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            FOUNDRY_VERSION=${{ needs.resolve.outputs.release_version }}
            FOUNDRY_REVISION=${{ github.sha }}

      - name: Verify headless image
        env:
          IMAGE_REF: foundry-headless-smoke:${{ github.sha }}
          ENGINE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
          SOURCE_REPOSITORY: https://github.com/cafecito-games/Foundry
          SOURCE_REVISION: ${{ github.sha }}
        run: .github/scripts/verify_headless_image.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release image
        uses: docker/build-push-action@v6
        # Reuse BuildKit's content-addressed cached graph for the registry export and add SBOM/provenance.
        # This is a second image export, not a second Foundry compilation.
        with:
          context: docker
          file: docker/foundry-headless.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            FOUNDRY_VERSION=${{ needs.resolve.outputs.release_version }}
            FOUNDRY_REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
