name: 🍎 macOS Builds
on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Git ref or SHA to check out. Defaults to the workflow ref.
        required: false
        type: string
        default: ""
  workflow_dispatch:

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
    "accesskit_sdk_path=${{ github.workspace }}/accesskit-c-0.21.2/"

jobs:
  build-macos:
    # From https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job#choosing-github-hosted-runners
    runs-on: macos-latest
    name: ${{ matrix.name }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor (target=editor)
            cache-name: macos-editor
            target: editor
            bin: ./bin/foundry.macos.editor.universal

          - name: Template (target=template_release)
            cache-name: macos-template
            target: template_release
            # Export templates strip the Foundry Script front-end, which is
            # incompatible with tests=yes (implied by dev_mode). Match the
            # iOS/Web/Android template jobs and disable unit tests here.
            scons-flags: debug_symbols=no tests=no
            bin: ./bin/foundry.macos.template_release.universal

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          submodules: recursive

      # From https://github.com/actions/runner-images/blob/main/images/macos
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Restore Foundry build cache
        uses: ./.github/actions/foundry-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/foundry-deps

      - name: Download pre-built AccessKit
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-accesskit-c-static
          version: tags/0.21.2
          file: accesskit-c-0.21.2.zip
          target: accesskit-c-0.21.2/accesskit_c.zip

      - name: Extract pre-built AccessKit
        run: unzip -o accesskit-c-0.21.2/accesskit_c.zip

      - name: Setup Vulkan SDK
        id: vulkan-sdk
        run: |
          if sh misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "VULKAN_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS: Vulkan SDK installation failed, building without Vulkan support."
            echo "VULKAN_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Compilation (x86_64)
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} arch=x86_64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }}
          platform: macos
          target: ${{ matrix.target }}

      - name: Compilation (arm64)
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} arch=arm64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }}
          platform: macos
          target: ${{ matrix.target }}

      - name: Save Foundry build cache
        uses: ./.github/actions/foundry-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Prepare artifact
        run: |
          lipo -create ./bin/foundry.macos.${{ matrix.target }}.x86_64 ./bin/foundry.macos.${{ matrix.target }}.arm64 -output ./bin/foundry.macos.${{ matrix.target }}.universal
          rm ./bin/foundry.macos.${{ matrix.target }}.x86_64 ./bin/foundry.macos.${{ matrix.target }}.arm64
          strip bin/foundry.*
          chmod +x bin/foundry.*

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}

      - name: Smoke test
        run: |
          ${{ matrix.bin }} --version
          ${{ matrix.bin }} --help

      - name: Unit tests
        # Export templates are built without unit-test support (tests=no), so
        # the test runner is only available on the editor build.
        if: matrix.target == 'editor'
        run: ${{ matrix.bin }} test run --force-colors

      - name: Foundry-Java macOS local input path aliases
        if: matrix.target == 'editor'
        run: |
          python3 -m unittest \
            tests.python_build.test_android_foundry_java_export.FoundryJavaExporterContractTests.test_command_first_export_accepts_macos_system_temp_alias_for_local_inputs \
            tests.python_build.test_android_foundry_java_export.FoundryJavaExporterContractTests.test_command_first_export_rejects_user_symlinks_below_macos_system_temp_alias \
            tests.python_build.test_android_foundry_java_export.FoundryJavaExporterContractTests.test_command_first_export_rejects_user_symlink_after_macos_alias_parent_component
