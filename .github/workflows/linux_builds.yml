name: Linux Builds

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Git ref or SHA to check out. Defaults to the workflow commit.
        required: false
        type: string
        default: ""
  workflow_dispatch:

env:
  SCONS_FLAGS: >-
    dev_mode=yes
    dev_build=yes
    tests=yes
    module_text_server_fb_enabled=yes

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    name: Editor dev build and tests
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          submodules: recursive

      - name: Setup dependencies
        timeout-minutes: 5
        run: |
          set -uo pipefail
          # wayland-scanner is the only thing this step provides. Probe first: the
          # runner image often ships it, and then apt is never touched.
          if command -v wayland-scanner >/dev/null 2>&1; then
            echo "wayland-scanner already present; skipping apt"
            exit 0
          fi
          # Try the install against the image's existing package lists first. The
          # `update` is the mirror-dependent half and is what stalls; skipping it
          # succeeds outright on most runners.
          sudo apt-get -o DPkg::Lock::Timeout=45 install -y --no-install-recommends libwayland-bin || \
            { sudo apt-get -o DPkg::Lock::Timeout=45 update \
              && sudo apt-get -o DPkg::Lock::Timeout=45 install -y --no-install-recommends libwayland-bin; } || true
          # Best effort by design. A stalled mirror must not fail a build job; if
          # the tool is genuinely missing, Compilation says so with a real error
          # instead of this step guessing.
          if command -v wayland-scanner >/dev/null 2>&1; then
            echo "wayland-scanner installed"
          else
            echo "::warning::wayland-scanner unavailable after apt; continuing and letting the build report it"
          fi
          exit 0

      - name: Free disk space on runner
        run: |
          echo "Disk usage before:" && df -h
          sudo rm -rf /usr/local/lib/android
          echo "Disk usage after:" && df -h

      - name: Restore Foundry build cache
        uses: ./.github/actions/foundry-cache-restore
        with:
          cache-name: linux-editor-tests
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/foundry-deps

      - name: Compilation
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }}
          platform: linuxbsd
          target: editor

      - name: Save Foundry build cache
        uses: ./.github/actions/foundry-cache-save
        with:
          cache-name: linux-editor-tests
        continue-on-error: true

      - name: Unit tests (sharded)
        env:
          # One single-threaded doctest process per shard. Keep this at or below the
          # runner's vCPU count; oversubscribing slows every shard down.
          FOUNDRY_SHARDS: 3
        run: |
          # No X server is provisioned on this runner, so DISPLAY stays unset and the
          # GUI-subprocess tests self-skip, exactly as they did before sharding. Setting
          # DISPLAY here would make them run against a display that does not exist.
          set -uo pipefail
          ./bin/foundry.linuxbsd.editor.dev.x86_64 --version
          ./bin/foundry.linuxbsd.editor.dev.x86_64 --help

          mkdir -p shard-logs
          pids=()
          for i in $(seq 1 "$FOUNDRY_SHARDS"); do
            # `user://` is now engine-isolated: `foundry test run` redirects the user-data
            # root to a per-shard directory under `$FOUNDRY_TEST_SCRATCH` (or the OS temp
            # dir) on every platform, so concurrent shards never share one `user://` tree.
            # These per-shard XDG homes are kept as defense-in-depth for config/cache paths
            # (shader cache, editor settings seams) that the user-data override does not
            # cover. They are the platform's own seam, so unsharded runs are unaffected.
            shard_home="${RUNNER_TEMP:-/tmp}/foundry-shard-home-$i"
            mkdir -p "$shard_home/config" "$shard_home/data" "$shard_home/cache"
            XDG_CONFIG_HOME="$shard_home/config" \
            XDG_DATA_HOME="$shard_home/data" \
            XDG_CACHE_HOME="$shard_home/cache" \
            ./bin/foundry.linuxbsd.editor.dev.x86_64 --headless test run \
              --shard "$i/$FOUNDRY_SHARDS" \
              --progress-format=jsonl --progress-file "shard-logs/shard-$i.jsonl" \
              --force-colors > "shard-logs/shard-$i.log" 2>&1 &
            pids+=("$!")
          done

          for pid in "${pids[@]}"; do wait "$pid" || true; done

          # The verdict comes from each shard's run_end event, not from the exit code: a
          # green run can still exit non-zero while reporting leaks during cleanup.
          # `--expected-shards` matters because the loop above ignores each shard's exit
          # code: without it, a shard killed before it opened its progress file would just
          # disappear and the survivors would report a green run over part of the suite.
          python3 .github/scripts/aggregate_test_shards.py shard-logs --expected-shards "$FOUNDRY_SHARDS"

      - name: Upload shard logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-shards
          path: shard-logs/

      # The type-completeness jobs must measure the very binary this job tested, not one they
      # rebuild from the same source with a different cache state.
      - name: Upload editor binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-editor-binary
          path: bin/foundry.linuxbsd.editor.dev.x86_64
          retention-days: 7

  type-completeness-baseline:
    runs-on: ubuntu-22.04
    name: Type-completeness develop baseline
    needs: build-linux
    # Only an unredirected `develop` run produces a baseline. `github.ref` describes the caller, not
    # the tree: `pr_platform_checks.yml` is triggered by `issue_comment`, which runs on the default
    # branch while passing a pull request's head as `checkout-ref`. Publishing from such a run would
    # upload a branch's own report under the `develop` commit's baseline name, and a later gate would
    # compare that branch against itself.
    if: github.ref == 'refs/heads/develop' && inputs.checkout-ref == ''
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}

      - name: Resolve the commit the baseline measures
        run: echo "baseline_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Download editor binary
        uses: actions/download-artifact@v4
        with:
          name: linux-editor-binary
          path: bin

      - name: Publish a baseline report per family
        env:
          FOUNDRY_TEST_SCRATCH: ${{ github.workspace }}/.test_scratch
        run: |
          set -euo pipefail
          chmod +x bin/foundry.linuxbsd.editor.dev.x86_64
          catalog=modules/foundry_script/tests/type_completeness
          mkdir -p baseline "$FOUNDRY_TEST_SCRATCH"
          # Every family with a rule manifest gets a baseline, not only the broad core: a pull request
          # may select any of them, and a family with no baseline is compared against an absent develop
          # side, which reads every one of its failures as new.
          for manifest in "$catalog"/rules/*.json; do
            family=$(basename "$manifest" .json)
            scratch="$FOUNDRY_TEST_SCRATCH/baseline-$family"
            mkdir -p "$scratch"
            ./bin/foundry.linuxbsd.editor.dev.x86_64 --headless test completeness run \
              --family "$family" \
              --catalog "$catalog" \
              --scratch "$scratch" \
              --report "$scratch/report.json" \
              --tier presubmit || echo "::warning::baseline run for $family exited non-zero"
            if [ -f "$scratch/report.json" ]; then
              cp "$scratch/report.json" "baseline/$family.json"
            fi
          done
          ls -l baseline

      - name: Upload baseline reports
        uses: actions/upload-artifact@v4
        with:
          # Named after the commit that was actually checked out, so the gate that downloads it by
          # merge base can never receive a report of a different tree.
          name: type-completeness-baseline-${{ env.baseline_sha }}
          path: baseline/
          retention-days: 30

  type-completeness-presubmit:
    runs-on: ubuntu-22.04
    name: Type-completeness presubmit gate
    needs: [build-linux, type-completeness-baseline]
    # On a develop push the gate downloads the baseline the sibling job uploads, so it must wait for
    # that upload. The baseline job is skipped on pull requests, and a plain `needs` edge would skip
    # the gate with it, so a skipped baseline is accepted explicitly; only a failed or cancelled one
    # withholds the gate.
    if: >-
      ${{ !cancelled() && needs.build-linux.result == 'success'
      && (needs.type-completeness-baseline.result == 'success'
      || needs.type-completeness-baseline.result == 'skipped') }}
    # The matrix portion is bounded separately by the runner's own `--timeout-seconds`; this bounds
    # everything around it.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          # The gate diffs against the merge base with `develop`, which needs real history.
          fetch-depth: 0

      - name: Download editor binary
        uses: actions/download-artifact@v4
        with:
          name: linux-editor-binary
          path: bin

      - name: Download the develop baseline for the merge base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          git fetch --no-tags origin develop
          merge_base=$(git merge-base origin/develop HEAD)
          echo "merge_base=$merge_base" >> "$GITHUB_ENV"
          mkdir -p baseline
          # A baseline that cannot be fetched is absent, not an error: the gate then compares every
          # in-slice failure against an absent develop side and reads it as new.
          gh run download --name "type-completeness-baseline-$merge_base" --dir baseline || \
            echo "::warning::no develop baseline artifact for $merge_base; every in-slice failure is new"
          ls -l baseline || true

      - name: Run the type-completeness gate
        env:
          FOUNDRY_TEST_SCRATCH: ${{ github.workspace }}/.test_scratch
        run: |
          set -uo pipefail
          chmod +x bin/foundry.linuxbsd.editor.dev.x86_64
          mkdir -p "$FOUNDRY_TEST_SCRATCH"
          # The gate's own exit code is the step's verdict, so nothing may run after it: a trailing
          # command would discard the distinction between blocked, timed out, and structurally broken.
          exec python3 scripts/type_completeness/presubmit.py \
            --binary bin/foundry.linuxbsd.editor.dev.x86_64 \
            --output-dir type-completeness \
            --scratch "$FOUNDRY_TEST_SCRATCH/presubmit" \
            --baseline-dir baseline \
            --ledger-dir modules/foundry_script/tests/type_completeness/findings \
            --merge-base-ref origin/develop

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type-completeness-presubmit-${{ github.run_id }}
          path: type-completeness/
          retention-days: 14

  release-vm-error-tests:
    runs-on: ubuntu-22.04
    name: Template release VM runtime error coverage
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          submodules: recursive

      - name: Setup dependencies
        timeout-minutes: 5
        run: |
          set -uo pipefail
          # wayland-scanner is the only thing this step provides. Probe first: the
          # runner image often ships it, and then apt is never touched.
          if command -v wayland-scanner >/dev/null 2>&1; then
            echo "wayland-scanner already present; skipping apt"
            exit 0
          fi
          # Try the install against the image's existing package lists first. The
          # `update` is the mirror-dependent half and is what stalls; skipping it
          # succeeds outright on most runners.
          sudo apt-get -o DPkg::Lock::Timeout=45 install -y --no-install-recommends libwayland-bin || \
            { sudo apt-get -o DPkg::Lock::Timeout=45 update \
              && sudo apt-get -o DPkg::Lock::Timeout=45 install -y --no-install-recommends libwayland-bin; } || true
          # Best effort by design. A stalled mirror must not fail a build job; if
          # the tool is genuinely missing, Compilation says so with a real error
          # instead of this step guessing.
          if command -v wayland-scanner >/dev/null 2>&1; then
            echo "wayland-scanner installed"
          else
            echo "::warning::wayland-scanner unavailable after apt; continuing and letting the build report it"
          fi
          exit 0

      - name: Restore Foundry build cache
        uses: ./.github/actions/foundry-cache-restore
        with:
          cache-name: linux-template-release-vm-error-tests
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/foundry-deps

      - name: Compilation
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: foundry_script_frontend=yes tests=yes module_text_server_fb_enabled=yes
          platform: linuxbsd
          target: template_release

      - name: Save Foundry build cache
        uses: ./.github/actions/foundry-cache-save
        with:
          cache-name: linux-template-release-vm-error-tests
        continue-on-error: true

      - name: Release-build VM runtime error tests
        run: |
          ./bin/foundry.linuxbsd.template_release.x86_64 --version
          ./bin/foundry.linuxbsd.template_release.x86_64 test run --force-colors --case "*Release-build VM runtime error*"
          ./bin/foundry.linuxbsd.template_release.x86_64 test run --force-colors --case "*FoundryCLIHelp*"
          # The type-completeness harness runs on this configuration too. Cells whose evidence a
          # release build cannot observe are published as not covered rather than skipped, so what the
          # suite proves here is that the harness measures this build instead of aborting on it.
          ./bin/foundry.linuxbsd.template_release.x86_64 test run --force-colors --case "*TypeCompleteness*"

  template-release-stripped-default:
    runs-on: ubuntu-22.04
    name: Template release stripped front-end (default)
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          submodules: recursive

      - name: Setup dependencies
        timeout-minutes: 5
        run: |
          set -uo pipefail
          # wayland-scanner is the only thing this step provides. Probe first: the
          # runner image often ships it, and then apt is never touched.
          if command -v wayland-scanner >/dev/null 2>&1; then
            echo "wayland-scanner already present; skipping apt"
            exit 0
          fi
          # Try the install against the image's existing package lists first. The
          # `update` is the mirror-dependent half and is what stalls; skipping it
          # succeeds outright on most runners.
          sudo apt-get -o DPkg::Lock::Timeout=45 install -y --no-install-recommends libwayland-bin || \
            { sudo apt-get -o DPkg::Lock::Timeout=45 update \
              && sudo apt-get -o DPkg::Lock::Timeout=45 install -y --no-install-recommends libwayland-bin; } || true
          # Best effort by design. A stalled mirror must not fail a build job; if
          # the tool is genuinely missing, Compilation says so with a real error
          # instead of this step guessing.
          if command -v wayland-scanner >/dev/null 2>&1; then
            echo "wayland-scanner installed"
          else
            echo "::warning::wayland-scanner unavailable after apt; continuing and letting the build report it"
          fi
          exit 0

      - name: Restore Foundry build cache
        uses: ./.github/actions/foundry-cache-restore
        with:
          cache-name: linux-template-release-stripped-default
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/foundry-deps

      - name: Compilation
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: module_text_server_fb_enabled=yes
          platform: linuxbsd
          target: template_release

      - name: Save Foundry build cache
        uses: ./.github/actions/foundry-cache-save
        with:
          cache-name: linux-template-release-stripped-default
        continue-on-error: true

      - name: Verify stripped template binary
        run: |
          ./bin/foundry.linuxbsd.template_release.x86_64 --version
