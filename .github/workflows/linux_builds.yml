name: Linux Builds

on:
  workflow_call:
  workflow_dispatch:

env:
  SCONS_FLAGS: >-
    dev_mode=yes
    dev_build=yes
    tests=yes
    module_text_server_fb_enabled=yes

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    name: Editor dev build and tests
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-bin

      - name: Free disk space on runner
        run: |
          echo "Disk usage before:" && df -h
          sudo rm -rf /usr/local/lib/android
          echo "Disk usage after:" && df -h

      - name: Restore Foundry build cache
        uses: ./.github/actions/foundry-cache-restore
        with:
          cache-name: linux-editor-tests
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/foundry-deps

      - name: Compilation
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }}
          platform: linuxbsd
          target: editor

      - name: Save Foundry build cache
        uses: ./.github/actions/foundry-cache-save
        with:
          cache-name: linux-editor-tests
        continue-on-error: true

      - name: Unit tests
        run: |
          ./bin/foundry.linuxbsd.editor.dev.x86_64 --version
          ./bin/foundry.linuxbsd.editor.dev.x86_64 --help
          ./bin/foundry.linuxbsd.editor.dev.x86_64 --headless --test --force-colors
