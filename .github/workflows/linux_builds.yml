name: Linux Builds

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Git ref or SHA to check out. Defaults to the workflow commit.
        required: false
        type: string
        default: ""
  workflow_dispatch:

env:
  SCONS_FLAGS: >-
    dev_mode=yes
    dev_build=yes
    tests=yes
    module_text_server_fb_enabled=yes

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    name: Editor dev build and tests
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          submodules: recursive

      - name: Setup dependencies
        timeout-minutes: 6
        run: |
          set -uo pipefail
          # wayland-scanner is the only thing this step exists to provide. The GitHub
          # runner image often ships it already, so probe before touching apt at all.
          if command -v wayland-scanner >/dev/null 2>&1; then
            echo "wayland-scanner already present; skipping apt"
            exit 0
          fi
          # apt can block indefinitely on the dpkg lock while the image's unattended
          # upgrades run, or stall mid-fetch on a slow mirror. Bound both, and retry.
          for attempt in 1 2 3; do
            if sudo apt-get -o DPkg::Lock::Timeout=120 update \
              && sudo apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends libwayland-bin; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed; retrying"
            sleep 15
          done
          echo "::error::failed to install libwayland-bin after 3 attempts"
          exit 1

      - name: Free disk space on runner
        run: |
          echo "Disk usage before:" && df -h
          sudo rm -rf /usr/local/lib/android
          echo "Disk usage after:" && df -h

      - name: Restore Foundry build cache
        uses: ./.github/actions/foundry-cache-restore
        with:
          cache-name: linux-editor-tests
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/foundry-deps

      - name: Compilation
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }}
          platform: linuxbsd
          target: editor

      - name: Save Foundry build cache
        uses: ./.github/actions/foundry-cache-save
        with:
          cache-name: linux-editor-tests
        continue-on-error: true

      - name: Unit tests (sharded)
        env:
          # One single-threaded doctest process per shard. Keep this at or below the
          # runner's vCPU count; oversubscribing slows every shard down.
          FOUNDRY_SHARDS: 3
        run: |
          # No X server is provisioned on this runner, so DISPLAY stays unset and the
          # GUI-subprocess tests self-skip, exactly as they did before sharding. Setting
          # DISPLAY here would make them run against a display that does not exist.
          set -uo pipefail
          ./bin/foundry.linuxbsd.editor.dev.x86_64 --version
          ./bin/foundry.linuxbsd.editor.dev.x86_64 --help

          mkdir -p shard-logs
          pids=()
          for i in $(seq 1 "$FOUNDRY_SHARDS"); do
            # `user://` is now engine-isolated: `foundry test run` redirects the user-data
            # root to a per-shard directory under `$FOUNDRY_TEST_SCRATCH` (or the OS temp
            # dir) on every platform, so concurrent shards never share one `user://` tree.
            # These per-shard XDG homes are kept as defense-in-depth for config/cache paths
            # (shader cache, editor settings seams) that the user-data override does not
            # cover. They are the platform's own seam, so unsharded runs are unaffected.
            shard_home="${RUNNER_TEMP:-/tmp}/foundry-shard-home-$i"
            mkdir -p "$shard_home/config" "$shard_home/data" "$shard_home/cache"
            XDG_CONFIG_HOME="$shard_home/config" \
            XDG_DATA_HOME="$shard_home/data" \
            XDG_CACHE_HOME="$shard_home/cache" \
            ./bin/foundry.linuxbsd.editor.dev.x86_64 --headless test run \
              --shard "$i/$FOUNDRY_SHARDS" \
              --progress-format=jsonl --progress-file "shard-logs/shard-$i.jsonl" \
              --force-colors > "shard-logs/shard-$i.log" 2>&1 &
            pids+=("$!")
          done

          for pid in "${pids[@]}"; do wait "$pid" || true; done

          # The verdict comes from each shard's run_end event, not from the exit code: a
          # green run can still exit non-zero while reporting leaks during cleanup.
          # `--expected-shards` matters because the loop above ignores each shard's exit
          # code: without it, a shard killed before it opened its progress file would just
          # disappear and the survivors would report a green run over part of the suite.
          python3 .github/scripts/aggregate_test_shards.py shard-logs --expected-shards "$FOUNDRY_SHARDS"

      - name: Upload shard logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-shards
          path: shard-logs/

  release-vm-error-tests:
    runs-on: ubuntu-22.04
    name: Template release VM runtime error coverage
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          submodules: recursive

      - name: Setup dependencies
        timeout-minutes: 6
        run: |
          set -uo pipefail
          # wayland-scanner is the only thing this step exists to provide. The GitHub
          # runner image often ships it already, so probe before touching apt at all.
          if command -v wayland-scanner >/dev/null 2>&1; then
            echo "wayland-scanner already present; skipping apt"
            exit 0
          fi
          # apt can block indefinitely on the dpkg lock while the image's unattended
          # upgrades run, or stall mid-fetch on a slow mirror. Bound both, and retry.
          for attempt in 1 2 3; do
            if sudo apt-get -o DPkg::Lock::Timeout=120 update \
              && sudo apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends libwayland-bin; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed; retrying"
            sleep 15
          done
          echo "::error::failed to install libwayland-bin after 3 attempts"
          exit 1

      - name: Restore Foundry build cache
        uses: ./.github/actions/foundry-cache-restore
        with:
          cache-name: linux-template-release-vm-error-tests
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/foundry-deps

      - name: Compilation
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: foundry_script_frontend=yes tests=yes module_text_server_fb_enabled=yes
          platform: linuxbsd
          target: template_release

      - name: Save Foundry build cache
        uses: ./.github/actions/foundry-cache-save
        with:
          cache-name: linux-template-release-vm-error-tests
        continue-on-error: true

      - name: Release-build VM runtime error tests
        run: |
          ./bin/foundry.linuxbsd.template_release.x86_64 --version
          ./bin/foundry.linuxbsd.template_release.x86_64 test run --force-colors --case "*Release-build VM runtime error*"
          ./bin/foundry.linuxbsd.template_release.x86_64 test run --force-colors --case "*FoundryCLIHelp*"

  template-release-stripped-default:
    runs-on: ubuntu-22.04
    name: Template release stripped front-end (default)
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          submodules: recursive

      - name: Setup dependencies
        timeout-minutes: 6
        run: |
          set -uo pipefail
          # wayland-scanner is the only thing this step exists to provide. The GitHub
          # runner image often ships it already, so probe before touching apt at all.
          if command -v wayland-scanner >/dev/null 2>&1; then
            echo "wayland-scanner already present; skipping apt"
            exit 0
          fi
          # apt can block indefinitely on the dpkg lock while the image's unattended
          # upgrades run, or stall mid-fetch on a slow mirror. Bound both, and retry.
          for attempt in 1 2 3; do
            if sudo apt-get -o DPkg::Lock::Timeout=120 update \
              && sudo apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends libwayland-bin; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed; retrying"
            sleep 15
          done
          echo "::error::failed to install libwayland-bin after 3 attempts"
          exit 1

      - name: Restore Foundry build cache
        uses: ./.github/actions/foundry-cache-restore
        with:
          cache-name: linux-template-release-stripped-default
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/foundry-deps

      - name: Compilation
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: module_text_server_fb_enabled=yes
          platform: linuxbsd
          target: template_release

      - name: Save Foundry build cache
        uses: ./.github/actions/foundry-cache-save
        with:
          cache-name: linux-template-release-stripped-default
        continue-on-error: true

      - name: Verify stripped template binary
        run: |
          ./bin/foundry.linuxbsd.template_release.x86_64 --version
