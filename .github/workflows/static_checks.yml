name: 📊 Static Checks
on:
  workflow_call:
  workflow_dispatch:
  # A pull request is only ever checked over the files it touches, so a finding in
  # an untouched file is invisible to that gate. These two triggers are the slower
  # net that sweeps the whole tree independently of what any pull request edits.
  push:
    branches:
      - develop
  schedule:
    # 09:00 UTC, outside the working day, so a nightly sweep never competes with
    # pull request builds for runners.
    - cron: "0 9 * * *"

permissions: {}

jobs:
  static-checks:
    name: Code style, file formatting, and docs
    # Forks inherit the schedule but not the tree this sweep exists to protect.
    if: github.event_name != 'schedule' || github.repository == 'cafecito-games/Foundry'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # This needs to happen before Python and npm execution; it must happen before any extra files are written.
      - name: .gitignore checks (gitignore_check.sh)
        run: |
          bash ./misc/scripts/gitignore_check.sh

      # The foundry-test-adapter hook is a `language: system` hook whose entry is
      # `uv run --frozen ...`, so uv has to be on PATH before prek dispatches it.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      # Pull requests stay on the fast changed-files path; every other trigger
      # (push to develop, the nightly schedule, a manual dispatch) sweeps the whole
      # tree so pre-existing findings cannot hide behind file scoping.
      - name: Resolve hook scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          changed=$(git diff-tree --no-commit-id --name-only -r HEAD^1..HEAD 2> /dev/null || true)
          scope=$(printf '%s\n' "$changed" | python3 ./.github/scripts/resolve_hook_scope.py --event-name "$EVENT_NAME")
          echo "Hook scope: $scope"
          echo "PREK_ARGS=$scope" >> "$GITHUB_ENV"

      - name: Style checks via prek
        uses: j178/prek-action@v2
        with:
          extra-args: ${{ env.PREK_ARGS }}
