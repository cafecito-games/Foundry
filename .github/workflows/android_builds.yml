name: 🤖 Android Builds

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Git ref or SHA to check out. Defaults to the workflow commit.
        required: false
        type: string
        default: ""
  workflow_dispatch:

jobs:
  validate-runtime-contracts:
    runs-on: ubuntu-24.04
    name: Validate in-tree Android host contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          submodules: recursive

      - name: Validate Android runtime contracts
        run: |
          python3 -m unittest \
            tests.python_build.test_android_runtime_contract \
            tests.python_build.test_android_runtime_build \
            tests.python_build.test_android_jni_contract \
            tests.python_build.test_android_native_staging \
            tests.python_build.test_android_gradle_behavioral \
            tests.python_build.test_android_gradle_runtime_contract \
            tests.python_build.test_android_device_acceptance -v
          python3 tests/python_build/test_android_runtime_surface.py
          python3 .github/scripts/test_android_runtime_workflows.py

  validate-foundry-java-export:
    runs-on: ubuntu-24.04
    name: Validate exact Foundry-Java Android export matrix
    timeout-minutes: 60
    env:
      FOUNDRY_JAVA_REPO: ${{ github.workspace }}/foundry-java-dependency
      FOUNDRY_TEST_SCRATCH: ${{ github.workspace }}/.test_scratch
    steps:
      - name: Checkout Foundry
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          submodules: recursive

      - name: Checkout exact Foundry-Java
        uses: actions/checkout@v6
        with:
          repository: cafecito-games/Foundry-Java
          ref: 0db6970116de257fffffffe2a55e89543d4a12b5
          path: foundry-java-dependency
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run exact Foundry-Java Android export matrix
        run: |
          python3 -m unittest -v \
            tests.python_build.test_android_foundry_java_export.FoundryJavaDocumentationTests.test_android_ci_runs_the_exact_foundry_java_matrix_without_skipping \
            tests.python_build.test_android_foundry_java_export.FoundryJavaAndroidIntegrationTests

  build-android-native:
    needs: validate-runtime-contracts
    runs-on: ubuntu-24.04
    name: Android native ${{ matrix.build_type }} / ${{ matrix.abi }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: debug
            abi: armeabi-v7a
            arch: arm32
            target: template_debug
            production: no
            dev_mode: no
            dev_build: no
            debug_symbols: no
            artifact_name: android-native-debug-armeabi-v7a
          - build_type: debug
            abi: arm64-v8a
            arch: arm64
            target: template_debug
            production: no
            dev_mode: no
            dev_build: no
            debug_symbols: no
            artifact_name: android-native-debug-arm64-v8a
          - build_type: debug
            abi: x86
            arch: x86_32
            target: template_debug
            production: no
            dev_mode: no
            dev_build: no
            debug_symbols: no
            artifact_name: android-native-debug-x86
          - build_type: debug
            abi: x86_64
            arch: x86_64
            target: template_debug
            production: no
            dev_mode: no
            dev_build: no
            debug_symbols: no
            artifact_name: android-native-debug-x86_64
          - build_type: dev
            abi: armeabi-v7a
            arch: arm32
            target: template_debug
            production: no
            dev_mode: yes
            dev_build: yes
            debug_symbols: yes
            artifact_name: android-native-dev-armeabi-v7a
          - build_type: dev
            abi: arm64-v8a
            arch: arm64
            target: template_debug
            production: no
            dev_mode: yes
            dev_build: yes
            debug_symbols: yes
            artifact_name: android-native-dev-arm64-v8a
          - build_type: dev
            abi: x86
            arch: x86_32
            target: template_debug
            production: no
            dev_mode: yes
            dev_build: yes
            debug_symbols: yes
            artifact_name: android-native-dev-x86
          - build_type: dev
            abi: x86_64
            arch: x86_64
            target: template_debug
            production: no
            dev_mode: yes
            dev_build: yes
            debug_symbols: yes
            artifact_name: android-native-dev-x86_64
          - build_type: release
            abi: armeabi-v7a
            arch: arm32
            target: template_release
            production: yes
            dev_mode: no
            dev_build: no
            debug_symbols: no
            artifact_name: android-native-release-armeabi-v7a
          - build_type: release
            abi: arm64-v8a
            arch: arm64
            target: template_release
            production: yes
            dev_mode: no
            dev_build: no
            debug_symbols: no
            artifact_name: android-native-release-arm64-v8a
          - build_type: release
            abi: x86
            arch: x86_32
            target: template_release
            production: yes
            dev_mode: no
            dev_build: no
            debug_symbols: no
            artifact_name: android-native-release-x86
          - build_type: release
            abi: x86_64
            arch: x86_64
            target: template_release
            production: yes
            dev_mode: no
            dev_build: no
            debug_symbols: no
            artifact_name: android-native-release-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          submodules: recursive

      - name: Resolve exact engine revision
        id: engine
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore Foundry build cache
        uses: ./.github/actions/foundry-cache-restore
        with:
          cache-name: ${{ matrix.artifact_name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/foundry-deps

      - name: Download Swappy
        run: python3 misc/scripts/install_swappy_android.py

      - name: Compile exact native cell
        uses: ./.github/actions/foundry-build
        with:
          platform: android
          target: ${{ matrix.target }}
          preserve-source-tree: true
          scons-flags: >-
            module_text_server_fb_enabled=yes
            tests=no
            swappy=yes
            arch=${{ matrix.arch }}
            production=${{ matrix.production }}
            dev_mode=${{ matrix.dev_mode }}
            dev_build=${{ matrix.dev_build }}
            debug_symbols=${{ matrix.debug_symbols }}

      - name: Save Foundry build cache
        uses: ./.github/actions/foundry-cache-save
        with:
          cache-name: ${{ matrix.artifact_name }}
        continue-on-error: true

      - name: Stage native cell with provenance
        env:
          ENGINE_REVISION: ${{ steps.engine.outputs.revision }}
        run: |
          set -euo pipefail
          CELL="bin/android-native/${ENGINE_REVISION}/${{ matrix.build_type }}/${{ matrix.abi }}"
          DEST="${RUNNER_TEMP}/android-native-artifact/${{ matrix.build_type }}/${{ matrix.abi }}"
          test -f "${CELL}/libc++_shared.so"
          test -f "${CELL}/libfoundry_android.so"
          test -f "${CELL}/provenance.json"
          mkdir -p "${DEST}"
          cp "${CELL}/libc++_shared.so" "${DEST}/"
          cp "${CELL}/libfoundry_android.so" "${DEST}/"
          cp "${CELL}/provenance.json" "${DEST}/"

      - name: Upload native cell
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/android-native-artifact

  compile-instrumented-assets:
    needs: validate-runtime-contracts
    runs-on: ubuntu-24.04
    name: Compile exact Android instrumented assets
    timeout-minutes: 60
    steps:
      - name: Checkout Foundry
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          submodules: recursive

      - name: Restore Foundry build cache
        uses: ./.github/actions/foundry-cache-restore
        with:
          cache-name: linuxbsd-editor-android-instrumented-assets
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/foundry-deps

      - name: Build exact host editor
        uses: ./.github/actions/foundry-build
        with:
          platform: linuxbsd
          target: editor
          preserve-source-tree: true
          scons-flags: >-
            module_text_server_fb_enabled=yes
            tests=no
            dev_mode=yes
            dev_build=yes

      - name: Save Foundry build cache
        uses: ./.github/actions/foundry-cache-save
        with:
          cache-name: linuxbsd-editor-android-instrumented-assets
        continue-on-error: true

      - name: Export compiled instrumented assets
        run: |
          set -euo pipefail
          mkdir -p .test_scratch/android-instrumented-assets
          cp -R platform/android/java/app/src/instrumented/assets \
            "${RUNNER_TEMP}/android-instrumented-project"
          rm -rf "${RUNNER_TEMP}/android-instrumented-project/.godot" \
            "${RUNNER_TEMP}/android-instrumented-project/.foundry"
          ./bin/foundry.linuxbsd.editor.dev.x86_64 --headless project export \
            --project "${RUNNER_TEMP}/android-instrumented-project" \
            --preset "Android Instrumented Assets" \
            --output "${RUNNER_TEMP}/android-instrumented-assets-raw.zip" \
            --mode pack
          python3 platform/android/android_device_acceptance.py prepare-compiled-assets \
            --source "${RUNNER_TEMP}/android-instrumented-assets-raw.zip" \
            --output .test_scratch/android-instrumented-assets/android-instrumented-assets.zip
          python3 platform/android/android_device_acceptance.py inspect-compiled-assets \
            --compiled-assets .test_scratch/android-instrumented-assets/android-instrumented-assets.zip

      - name: Upload compiled instrumented assets
        uses: ./.github/actions/upload-artifact
        with:
          name: android-instrumented-assets
          path: .test_scratch/android-instrumented-assets/android-instrumented-assets.zip

      - name: Upload command-first editor
        uses: ./.github/actions/upload-artifact
        with:
          name: linuxbsd-editor-foundry-java-command-first
          path: bin/foundry.linuxbsd.editor.dev.x86_64

  assemble-android:
    needs:
      - validate-runtime-contracts
      - build-android-native
    runs-on: ubuntu-24.04
    name: Assemble Android templates with in-tree host
    timeout-minutes: 60
    steps:
      - name: Checkout Foundry
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Download every native cell
        uses: actions/download-artifact@v8
        with:
          pattern: 'android-native-*'
          path: .test_scratch/android-native
          merge-multiple: true

      - name: Assemble and verify in-tree host
        run: |
          set -euo pipefail
          test "$(find .test_scratch/android-native -name provenance.json -type f | wc -l | tr -d ' ')" = "12"
          cd platform/android/java
          ./gradlew --no-daemon generateFoundryTemplates \
            -PfoundryNativeRoot="${GITHUB_WORKSPACE}/.test_scratch/android-native"
          cd ../../..
          test -f bin/android_debug.apk
          test -f bin/android_dev.apk
          test -f bin/android_release.apk
          test -f bin/android_source.zip
          test -f bin/foundry-debug.aar
          test -f bin/foundry-dev.aar
          test -f bin/foundry-release.aar

      - name: Upload assembled Android templates
        uses: ./.github/actions/upload-artifact
        with:
          name: android-templates-assembled
          path: |
            bin/android_debug.apk
            bin/android_dev.apk
            bin/android_release.apk
            bin/android_source.zip
            bin/foundry-debug.aar
            bin/foundry-dev.aar
            bin/foundry-release.aar

  foundry-java-command-first:
    needs:
      - validate-foundry-java-export
      - assemble-android
      - compile-instrumented-assets
    runs-on: ubuntu-24.04
    name: Export Foundry-Java APKs through the command-first editor
    timeout-minutes: 60
    env:
      FOUNDRY_JAVA_COMMAND_FIRST_ACCEPTANCE: '1'
      FOUNDRY_JAVA_REPO: ${{ github.workspace }}/foundry-java-dependency
      FOUNDRY_EDITOR_BINARY: ${{ github.workspace }}/.test_scratch/foundry-java-editor/foundry.linuxbsd.editor.dev.x86_64
      FOUNDRY_ANDROID_SOURCE_TEMPLATE: ${{ github.workspace }}/.test_scratch/android-templates-assembled/android_source.zip
      FOUNDRY_JAVA_COMMAND_FIRST_OUTPUT: ${{ github.workspace }}/.test_scratch/foundry-java-command-first
      FOUNDRY_TEST_SCRATCH: ${{ github.workspace }}/.test_scratch
    steps:
      - name: Checkout Foundry
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          submodules: recursive

      - name: Checkout exact Foundry-Java
        uses: actions/checkout@v6
        with:
          repository: cafecito-games/Foundry-Java
          ref: 0db6970116de257fffffffe2a55e89543d4a12b5
          path: foundry-java-dependency
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android API 36 build dependencies
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0"

      - name: Download command-first editor
        uses: actions/download-artifact@v8
        with:
          name: linuxbsd-editor-foundry-java-command-first
          path: .test_scratch/foundry-java-editor

      - name: Download assembled Android source template
        uses: actions/download-artifact@v8
        with:
          name: android-templates-assembled
          path: .test_scratch/android-templates-assembled

      - name: Run positive command-first Foundry-Java acceptance
        run: |
          set -euo pipefail
          chmod +x "${FOUNDRY_EDITOR_BINARY}"
          python3 -m unittest -v \
            tests.python_build.test_android_foundry_java_export.FoundryJavaAndroidIntegrationTests.test_command_first_source_template_acceptance

      - name: Upload command-first APKs and evidence
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: foundry-java-command-first-exports
          path: |
            .test_scratch/foundry-java-command-first/foundry-java-default-debug.apk
            .test_scratch/foundry-java-command-first/foundry-java-custom-release.apk
            .test_scratch/foundry-java-command-first/foundry-java-command-first-evidence.json

  device-acceptance:
    needs:
      - assemble-android
      - compile-instrumented-assets
      - foundry-java-command-first
    runs-on: ubuntu-24.04
    name: Verify Android runtime on an emulator
    timeout-minutes: 120
    steps:
      - name: Checkout Foundry
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Download assembled Android templates
        uses: actions/download-artifact@v8
        with:
          name: android-templates-assembled
          path: .test_scratch/android-templates-assembled

      - name: Download compiled instrumented assets
        uses: actions/download-artifact@v8
        with:
          name: android-instrumented-assets
          path: .test_scratch/android-instrumented-assets

      - name: Download command-first Foundry-Java APKs
        uses: actions/download-artifact@v8
        with:
          name: foundry-java-command-first-exports
          path: .test_scratch/foundry-java-command-first

      - name: Install Android emulator
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "system-images;android-36;default;x86_64"
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Create and launch acceptance emulator
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/android-avd"
          echo "ANDROID_AVD_HOME=${ANDROID_AVD_HOME}" >> "${GITHUB_ENV}"
          mkdir -p "${ANDROID_AVD_HOME}"
          echo no | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd --force \
            --name foundry-acceptance \
            --package "system-images;android-36;default;x86_64"
          nohup "${ANDROID_HOME}/emulator/emulator" \
            -avd foundry-acceptance \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            > "${RUNNER_TEMP}/foundry-emulator.log" 2>&1 &

      - name: Wait for observable emulator boot
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/platform-tools/adb" start-server
          attempt=1
          while test "${attempt}" -le 180; do
            if test "$("${ANDROID_HOME}/platform-tools/adb" -s emulator-5554 shell \
              getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"; then
              "${ANDROID_HOME}/platform-tools/adb" -s emulator-5554 devices -l
              exit 0
            fi
            sleep 2
            attempt=$((attempt + 1))
          done
          "${ANDROID_HOME}/platform-tools/adb" devices -l
          exit 1

      - name: Run source-template device acceptance
        run: |
          set -euo pipefail
          python3 platform/android/android_device_acceptance.py source-template \
            --source-template .test_scratch/android-templates-assembled/android_source.zip \
            --compiled-assets .test_scratch/android-instrumented-assets/android-instrumented-assets.zip \
            --work-dir "${RUNNER_TEMP}/android-device-acceptance-work" \
            --evidence-dir "${RUNNER_TEMP}/android-device-acceptance-evidence" \
            --adb "${ANDROID_HOME}/platform-tools/adb" \
            --apkanalyzer "${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer" \
            --process-timeout 120 \
            --serial emulator-5554

      - name: Run command-first Foundry-Java APK acceptance
        run: |
          set -euo pipefail
          python3 platform/android/android_device_acceptance.py verify-apks \
            --apk games.cafecito.foundry.game=.test_scratch/foundry-java-command-first/foundry-java-default-debug.apk \
            --apk dev.example.foundryjava=.test_scratch/foundry-java-command-first/foundry-java-custom-release.apk \
            --evidence-dir "${RUNNER_TEMP}/foundry-java-command-first-device-evidence" \
            --adb "${ANDROID_HOME}/platform-tools/adb" \
            --apkanalyzer "${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer" \
            --process-timeout 120 \
            --serial emulator-5554

      - name: Upload Android device acceptance evidence
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: android-device-acceptance-evidence
          path: |
            ${{ runner.temp }}/android-device-acceptance-evidence
            ${{ runner.temp }}/foundry-java-command-first-device-evidence
            ${{ runner.temp }}/foundry-emulator.log
