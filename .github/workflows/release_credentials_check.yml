name: 🔑 Release credentials check

# Verifies the release tagging credential without cutting a release: mints an
# app installation token from RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY and
# confirms the installation still covers this repository. Run it after creating
# the app, after rotating its private key, or whenever a release fails to tag.
on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Mint release tag token
        id: release-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Confirm the installation covers this repository
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          set -euo pipefail

          gh api /installation/repositories --paginate \
            --jq '.repositories[].full_name' | sort | tee installation-repositories.txt

          if ! grep -qx "$GITHUB_REPOSITORY" installation-repositories.txt; then
            echo "::error::The release app installation does not cover $GITHUB_REPOSITORY."
            echo "::error::Add it under the app's Install App -> repository selection."
            exit 1
          fi

          echo "Release credential OK for $GITHUB_REPOSITORY."
