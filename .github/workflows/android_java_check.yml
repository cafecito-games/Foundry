name: 🤖 Android Java Check

# Android changes use the same complete native matrix and in-tree host
# assembly gate as reusable platform CI. Keeping one workflow prevents a
# one-architecture Java check from drifting into a second build authority.
on:
  pull_request:
    paths:
      - "platform/android/**"
      - "tests/python_build/test_android_*"
      - ".github/scripts/test_android_runtime_workflows.py"
      - ".github/workflows/android_builds.yml"
      - ".github/workflows/android_java_check.yml"
  push:
    branches:
      - develop
    paths:
      - "platform/android/**"
      - "tests/python_build/test_android_*"
      - ".github/scripts/test_android_runtime_workflows.py"
      - ".github/workflows/android_builds.yml"
      - ".github/workflows/android_java_check.yml"
  workflow_dispatch:

concurrency:
  group: android-java-check|${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    name: Authoritative Android runtime and templates
    uses: ./.github/workflows/android_builds.yml
    with:
      checkout-ref: ${{ github.event.pull_request.head.sha || github.sha }}
