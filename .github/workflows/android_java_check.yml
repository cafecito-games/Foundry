name: 🤖 Android Java Check

# Verifies the Android library builds end-to-end (native SCons build + Gradle
# assembly of the library AAR and template APK) whenever a pull request touches
# the Android platform code. This guards the Java/Kotlin sources and the C++ JNI
# layer together: a JNI symbol/class rename that no longer matches its bound Java
# class compiles and links, but breaks the Gradle assembly or the runtime binding,
# so exercising the full native+Gradle path on PRs catches those regressions early.
on:
  pull_request:
    paths:
      - "platform/android/**"
  push:
    branches:
      - develop
    paths:
      - "platform/android/**"
  workflow_dispatch:

concurrency:
  group: android-java-check|${{ github.ref_name }}
  cancel-in-progress: true

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
    tests=no
    swappy=yes
    arch=arm64

jobs:
  android-java-check:
    runs-on: ubuntu-24.04
    name: Android library (template_debug, arm64)
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Foundry build cache
        uses: ./.github/actions/foundry-cache-restore
        with:
          cache-name: android-java-check
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/foundry-deps

      - name: Download Swappy
        run: python ./misc/scripts/install_swappy_android.py

      - name: Compilation (native template_debug arm64)
        uses: ./.github/actions/foundry-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }}
          platform: android
          target: template_debug

      - name: Save Foundry build cache
        uses: ./.github/actions/foundry-cache-save
        with:
          cache-name: android-java-check
        continue-on-error: true

      # Compiles the Java/Kotlin sources, assembles the foundry-lib AAR, and builds
      # the template APK using the native libraries produced above. This is the step
      # that fails if the Java surface or the JNI bindings are inconsistent.
      - name: Assemble Android library (Gradle)
        run: |
          cd platform/android/java
          ./gradlew generateFoundryTemplates
          cd ../../..
          ls -l bin/

      - name: Upload library AAR
        uses: ./.github/actions/upload-artifact
        with:
          name: android-java-check-aar
          path: bin/foundry-lib.template_debug.aar
